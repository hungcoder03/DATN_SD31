<style>
  .filter-section {
    background-color: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 30px;
  }

  .filter-buttons .btn {
    margin-right: 10px;
    margin-bottom: 10px;
  }

  .table-section {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
  }

  .table-section .table thead th {
    background-color: #f1f1f1;
  }

  .action-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 5px;
  }

  .action-btn.accept {
    color: green;
  }

  .action-btn.cancel {
    color: red;
  }
</style>

<div th:fragment="page">
  <div class="container mt-4">
    <h2 class="mb-4 text-center">Quản Lý Phiếu giảm giá</h2>
    <a th:href="@{/admin/phieu-giam-gia/create}" class="btn btn-success mb-3">
      + Thêm mới
    </a>

    <!-- Filter Section -->
    <form
            th:action="@{/admin/phieu-giam-gia}"
            method="get"
            class="filter-section"
    >
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label for="startDate" class="form-label">Ngày bắt đầu</label>
          <input
                  type="date"
                  class="form-control"
                  id="startDate"
                  name="startDate"
                  th:value="${startDate}"
          />
        </div>
        <div class="col-md-3">
          <label for="endDate" class="form-label">Ngày kết thúc</label>
          <input
                  type="date"
                  class="form-control"
                  id="endDate"
                  name="endDate"
                  th:value="${endDate}"
          />
        </div>
        <div class="col-md-3">
          <label for="status" class="form-label">Trạng thái</label>
          <select class="form-select" id="status" name="status">
            <option value="">-- Tất cả --</option>
            <option value="hoatdong" th:selected="${status == 'hoatdong'}">
              Đang hoạt động
            </option>
            <option value="chuabatdau" th:selected="${status == 'chuabatdau'}">
              Đang chờ
            </option>
            <option value="ketthuc" th:selected="${status == 'ketthuc'}">
              Kết thúc
            </option>
            <option value="hethang" th:selected="${status == 'hethang'}">
              Sử dụng hết
            </option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
          <a
                  th:href="@{/admin/phieu-giam-gia}"
                  class="btn btn-outline-secondary w-100"
          >Làm mới</a
          >
        </div>
      </div>
    </form>

    <!-- Table Section -->
    <div class="table-section">
      <div class="table-section">
        <table
                class="table table-bordered"
                id="phieuGiamGiaTable"
                style="width: 100%"
        >
          <thead>
          <tr>
            <th>STT</th>
            <th>Tên</th>
            <th>Mã</th>
            <th>Loại phiếu</th>
            <th>Mức giảm</th>
            <th>Giảm tối đa</th>
            <th>Số lượng</th>
            <th>Ngày bắt đầu</th>
            <th>Ngày kết thúc</th>
            <th>Trạng thái</th>
            <th>Thao Tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item, iterStat : ${listData}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${item.ten}"></td>
            <td th:text="${item.ma}"></td>
            <td
                    th:text="${item.loaiPhieuGiamGia == 1 ? 'Giảm %' : 'Giảm tiền'}"
            ></td>
            <td
                    th:text="${item.loaiPhieuGiamGia == 1 ? item.mucDo.stripTrailingZeros().toPlainString() + '%' : item.mucDo.stripTrailingZeros().toPlainString() + ' đ'}"
            ></td>
            <td
                    th:text="${item.loaiPhieuGiamGia == 1 ? 0 : item.giamToiDa.stripTrailingZeros().toPlainString() + ' đ'}"
            ></td>
            <td
                    th:text="${item.soLuongTon != null ? item.soLuongTon : 0}"
            ></td>
            <td th:text="${item.ngayBatDau}"></td>
            <td th:text="${item.ngayKetThuc}"></td>
            <td>
                <span th:if="${item.soLuongTon == 0}" class="badge bg-secondary"
                >Sử dụng hết</span
                >
              <span
                      th:if="${item.ngayBatDau > T(java.time.LocalDate).now() and item.soLuongTon > 0}"
                      class="badge bg-warning text-dark"
              >Đang chờ</span
              >
              <span
                      th:if="${item.ngayKetThuc < T(java.time.LocalDate).now() and item.soLuongTon > 0}"
                      class="badge bg-danger"
              >Kết thúc</span
              >
              <span
                      th:if="${item.ngayBatDau <= T(java.time.LocalDate).now() and item.ngayKetThuc >= T(java.time.LocalDate).now() and item.soLuongTon > 0}"
                      class="badge bg-success"
              >Đang hoạt động</span
              >
            </td>
            <td>
              <a
                      th:href="@{/admin/phieu-giam-gia/edit/{id}(id=${item.id})}"
                      class="btn btn-primary btn-sm"
              >
                Sửa
              </a>
              <a
                      th:href="@{'/admin/phieu-giam-gia/delete/' + ${item.id}}"
                      onclick="return confirm('Bạn có chắc muốn xóa phiếu này không?')"
                      class="btn btn-danger btn-sm"
              >
                Xóa
              </a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    $(".table").DataTable({
      language: {
        url: "https://cdn.datatables.net/plug-ins/1.13.4/i18n/vi.json",
      },
      pageLength: 10,
      lengthMenu: [10, 25, 50, 100],
    });
  });
</script>
