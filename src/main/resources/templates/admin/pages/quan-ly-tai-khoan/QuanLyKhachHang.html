<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<section layout:fragment="content">
<div>
    <h1 class="text-center mb-4">Dashboard Admin</h1>

    <!-- NAV BUTTONS -->
    <div class="text-center mb-4">
        <a th:href="@{/admin/quanlytaikhoan/nhanvien}" class="btn btn-success me-2">
            <i class="bi bi-person-lines-fill"></i> Quản lý Nhân viên
        </a>
        <a th:href="@{/admin/quanlytaikhoan/khachhang}" class="btn btn-primary">
            <i class="bi bi-people-fill"></i> Quản lý Khách hàng
        </a>
    </div>
</div>

<div class="container my-5">
    <h1 class="text-center mb-4">Quản lý khách hàng</h1>

    <div class="d-flex justify-content-between mb-3">
        <form th:action="@{/admin/quanlytaikhoan/khachhang/search}" method="get" class="d-flex">
            <input type="number"
                   name="id"
                   class="form-control me-2"
                   placeholder="Tìm ID khách hàng"
                   required>
            <button type="submit" class="btn btn-secondary">
                <i class="bi bi-search"></i> Tìm
            </button>
        </form>
        <button type="button"
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#khModal">
            <i class="bi bi-person-plus"></i> Thêm khách hàng
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>STT</th>
                    <th>Tên</th>
                    <th>SĐT</th>
                    <th>Email</th>
                    <th>Ngày sinh</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="kh, stat : ${khachhangList}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${kh.ten}"></td>
                    <td th:text="${kh.soDienThoai}"></td>
                    <td th:text="${kh.email}"></td>
                    <td th:text="${kh.ngaySinh}"></td>
                    <td th:text="${kh.trangThai} ? 'Hoạt' : 'Khoá'"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/admin/quanlytaikhoan/khachhang/chitiet(id=${kh.id})}"
                           class="btn btn-sm btn-info">
                            Chi tiết
                        </a>
                        <a th:href="@{/admin/quanlytaikhoan/khachhang/sua(id=${kh.id})}" class="btn btn-sm btn-warning">
                            Sửa
                        </a>
                        <a th:href="@{/admin/quanlytaikhoan/khachhang/delete(id=${kh.id})}"
                           class="btn btn-sm btn-danger">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Thêm / Sửa Khách hàng -->
<div class="modal fade" id="khModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <form th:action="@{/admin/quanlytaikhoan/khachhang/save}"
                  th:object="${khachhang}"
                  method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm / Cập nhật khách hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6 form-floating">
                            <input type="text" th:field="*{ma}" class="form-control" placeholder="Mã" required>
                            <label for="ma">Mã</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" th:field="*{ten}" class="form-control" placeholder="Tên" required>
                            <label for="ten">Tên</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="date" th:field="*{ngaySinh}" class="form-control" placeholder="Ngày sinh" required>
                            <label for="ngaySinh">Ngày sinh</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="Số điện thoại" required>
                            <label for="soDienThoai">Số điện thoại</label>
                        </div>
                        <input type="hidden" th:field="*{ngayThamGia}"/>
                        <div class="col-md-6 form-floating">
                            <select th:field="*{gioiTinh}" class="form-select" required>
                                <option value="true">Nam</option>
                                <option value="false">Nữ</option>
                            </select>
                            <label for="gioiTinh">Giới tính</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <input type="password" th:field="*{matKhau}" class="form-control" placeholder="Mật khẩu" required>
                            <label for="matKhau">Mật khẩu</label>
                        </div>
                        <div class="col-md-6 form-floating">
                            <select th:field="*{trangThai}" class="form-select" required>
                                <option value="true">Hoạt động</option>
                                <option value="false">Khoá</option>
                            </select>
                            <label for="trangThai">Trạng thái</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
