<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${readonly} ? 'Thông tin khách hàng' : 'Chỉnh sửa khách hàng'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 class="text-center mb-4" th:text="${readonly} ? 'Thông tin khách hàng' : 'Cập nhật khách hàng'"></h2>
    <form th:action="@{/admin/quanlytaikhoan/khachhang/save}"
          th:object="${khachhang}" method="post">
        <div class="row g-3">
            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{ma}" class="form-control" placeholder="Mã"
                       th:readonly="${readonly}" required>
                <label>Mã</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{ten}" class="form-control" placeholder="Tên"
                       th:readonly="${readonly}" required>
                <label>Tên</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="date"
                       th:field="*{ngaySinh}"
                       class="form-control"
                       placeholder="Ngày sinh"
                       th:readonly="${readonly}" required>
                <label>Ngày sinh</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="Số điện thoại"
                       th:readonly="${readonly}" required>
                <label>Số điện thoại</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="date"
                       th:field="*{ngayThamGia}"
                       class="form-control"
                       placeholder="Ngày tham gia"
                       th:readonly="${readonly}" required>
                <label>Ngày tham gia</label>
            </div>

            <div class="col-md-6 form-floating">
                <select th:field="*{gioiTinh}" class="form-select"
                        th:disabled="${readonly}" required>
                    <option value="true">Nam</option>
                    <option value="false">Nữ</option>
                </select>
                <label>Giới tính</label>
            </div>
            <div class="col-md-6 form-floating">
                <input type="email" th:field="*{email}" class="form-control" placeholder="Email"
                       th:readonly="${readonly}" required>
                <label>Email</label>
            </div>

            <div class="col-md-6 form-floating">
                <select th:field="*{trangThai}" class="form-select"
                        th:disabled="${readonly}" required>
                    <option value="true">Hoạt động</option>
                    <option value="false">Khoá</option>
                </select>
                <label>Trạng thái</label>
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <a href="/admin/quanlytaikhoan/khachhang" class="btn btn-secondary">Quay lại</a>
            <button type="submit" class="btn btn-primary" th:if="${!readonly}">Lưu</button>
        </div>
    </form>
</div>
</body>
</html>
