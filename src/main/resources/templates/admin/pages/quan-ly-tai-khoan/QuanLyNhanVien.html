<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<section layout:fragment="content">

    <div class="container my-5">
        <h1 class="text-center mb-4">Quản lý nhân viên</h1>

        <div class="d-flex justify-content-between mb-3">
            <!-- Search -->
            <form th:action="@{/admin/quanlytaikhoan/nhanvien/search}" method="get" class="d-flex">
                <input type="text"
                       name="search"
                       th:value="${param.search}"
                       class="form-control me-2"
                       placeholder="Nhập mã, tên, SĐT hoặc email…"/>
                <button type="submit" class="btn btn-secondary">
                    <i class="bi bi-search"></i> Tìm
                </button>
                <a th:if="${param.search}" th:href="@{/admin/quanlytaikhoan/nhanvien}" class="btn btn-outline-secondary ms-2">
                    <i class="bi bi-arrow-counterclockwise"></i> Quay lại
                </a>
            </form>

            <!-- Add button -->
            <button type="button"
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#nvModal">
                <i class="bi bi-person-plus"></i> Thêm nhân viên
            </button>
        </div>

        <!-- Table -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead class="table-dark text-center">
                    <tr>
                        <th>STT</th><th>Tên</th><th>SĐT</th><th>Email</th>
                        <th>Chức vụ</th><th>Trạng thái</th><th>Ảnh</th><th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="nv, stat : ${nhanvienList}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${nv.ten}">Nguyễn A</td>
                        <td th:text="${nv.soDienThoai}">0123456789</td>
                        <td th:text="${nv.email}">a@example.com</td>
                        <td th:text="${nv.chucVu == '1' ? 'Nhân viên' : 'Quản lý'}">Nhân viên</td>
                        <td th:text="${nv.trangThai} ? 'Hoạt động' : 'Ngưng hoạt động'">Hoạt động</td>
                        <td>
                            <img th:if="${nv.anh}" th:src="@{${nv.anh}}" class="rounded-circle" style="height:40px;" alt="Ảnh NV"/>
                        </td>
                        <td class="text-nowrap">
                            <a th:href="@{/admin/quanlytaikhoan/nhanvien/detail(id=${nv.id})}" class="btn btn-sm btn-info">Chi tiết</a>
                            <a th:href="@{/admin/quanlytaikhoan/nhanvien/edit(id=${nv.id})}"   class="btn btn-sm btn-warning">Sửa</a>
                            <a th:href="@{/admin/quanlytaikhoan/nhanvien/delete(id=${nv.id})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Bạn có chắc chắn muốn xoá?')">Xóa</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- Modal Thêm Nhân viên -->
    <div class="modal fade" id="nvModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <form th:action="@{/admin/quanlytaikhoan/nhanvien/save}"
                      th:object="${nhanvien}"
                      method="post"
                      enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title">Thêm nhân viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">

                            <!-- Mã NV -->
                            <div class="col-md-6 form-floating">
                                <input type="text" th:field="*{ma}" class="form-control" placeholder="NV12345" required>
                                <label>Mã </label>
                                <div th:if="${#fields.hasErrors('ma')}" th:errors="*{ma}" class="text-danger small"></div>
                            </div>

                            <!-- Tên -->
                            <div class="col-md-6 form-floating">
                                <input type="text" th:field="*{ten}" class="form-control" placeholder="Tên" required>
                                <label>Tên</label>
                                <div th:if="${#fields.hasErrors('ten')}" th:errors="*{ten}" class="text-danger small"></div>
                            </div>

                            <!-- Ngày sinh -->
                            <div class="col-md-6 form-floating">
                                <input type="date" th:field="*{ngaySinh}" class="form-control" placeholder="Ngày sinh" required>
                                <label>Ngày sinh</label>
                                <div th:if="${#fields.hasErrors('ngaySinh')}" th:errors="*{ngaySinh}" class="text-danger small"></div>
                            </div>

                            <!-- SĐT -->
                            <div class="col-md-6 form-floating">
                                <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="Số điện thoại" required>
                                <label>Số điện thoại</label>
                                <div th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}" class="text-danger small"></div>
                            </div>

                            <!-- Ngày tham gia (ẩn) -->
                            <input type="hidden" th:field="*{ngayThamGia}"/>

                            <!-- CMND -->
                            <div class="col-md-6 form-floating">
                                <input type="text" th:field="*{chungMinhThu}" class="form-control" placeholder="CMND" required>
                                <label>CMND</label>
                                <div th:if="${#fields.hasErrors('chungMinhThu')}" th:errors="*{chungMinhThu}" class="text-danger small"></div>
                            </div>

                            <!-- Giới tính -->
                            <div class="col-md-6 form-floating">
                                <select th:field="*{gioiTinh}" class="form-select" required>
                                    <option value="true">Nam</option>
                                    <option value="false">Nữ</option>
                                </select>
                                <label>Giới tính</label>
                            </div>

                            <!-- Ảnh -->
                            <div class="col-md-6 form-floating">
                                <input type="file" name="anhFile" class="form-control" id="anhFile">
                                <label for="anhFile">Ảnh nhân viên</label>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6 form-floating">
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                                <label>Email </label>
                                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
                            </div>

                            <!-- Mật khẩu + toggle -->
                            <div class="col-md-6">
                                <div class="form-floating position-relative">
                                    <input th:type="${passwordVisible} ? 'text' : 'password'"
                                           th:field="*{matKhau}"
                                           id="matKhauInput"
                                           class="form-control"
                                           placeholder="Mật khẩu"
                                           required>
                                    <label for="matKhauInput">Mật khẩu</label>
                                    <button type="button"
                                            class="btn btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2 border-0"
                                            style="z-index:10"
                                            onclick="togglePasswordVisibility()">
                                        <i class="bi" id="eyeIcon"
                                           th:classappend="${passwordVisible} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </div>
                                <div th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Chức vụ -->
                            <div class="col-md-6 form-floating">
                                <select th:field="*{chucVu}" class="form-select" required>
                                    <option value="0">Quản lý</option>
                                    <option value="1">Nhân viên</option>
                                </select>
                                <label>Chức vụ</label>
                                <div th:if="${#fields.hasErrors('chucVu')}" th:errors="*{chucVu}" class="text-danger small"></div>
                            </div>

                            <!-- Trạng thái -->
                            <div class="col-md-6 form-floating">
                                <select th:field="*{trangThai}" class="form-select" required>
                                    <option value="true">Hoạt động</option>
                                    <option value="false">Ngưng hoạt động</option>
                                </select>
                                <label>Trạng thái</label>
                                <div th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}" class="text-danger small"></div>
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="nvModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <form th:action="@{/admin/quanlytaikhoan/nhanvien/save}"
                      th:object="${nhanvien}"
                      method="post"
                      enctype="multipart/form-data">
                    <!-- header, body, footer giống như bạn đã làm -->
                </form>
            </div>
        </div>
    </div>
    <!-- Show modal lại khi có lỗi -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        if ( [[${showModal}]] ) {
            new bootstrap.Modal(document.getElementById('nvModal')).show();
        }
        /*]]>*/
    </script>
    <!-- Toggle password -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        function togglePasswordVisibility() {
            const input = document.getElementById("matKhauInput");
            const icon  = document.getElementById("eyeIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("bi-eye-slash", "bi-eye");
            }
        }
        /*]]>*/

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</section>
</body>
</html>
