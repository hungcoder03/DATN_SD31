<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<section layout:fragment="content" class="container my-5">

    <h2 class="text-center mb-4">Thêm Nhân Viên</h2>

    <form th:action="@{/admin/quanlytaikhoan/nhanvien/save}" th:object="${nhanvien}" method="post" enctype="multipart/form-data">
        <div class="row g-3">

            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{ma}" class="form-control" placeholder="Mã" required>
                <label>Mã</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{ten}" class="form-control" placeholder="Tên" required>
                <label>Tên</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="date" th:field="*{ngaySinh}" class="form-control" placeholder="Ngày sinh">
                <label>Ngày sinh</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="Số điện thoại" required>
                <label>Số điện thoại</label>
            </div>

            <input type="hidden" th:field="*{ngayThamGia}"/>

            <div class="col-md-6 form-floating">
                <input type="text" th:field="*{chungMinhThu}" class="form-control" placeholder="CMND" required>
                <label>CMND</label>
            </div>

            <div class="col-md-6 form-floating">
                <select th:field="*{gioiTinh}" class="form-select" required>
                    <option value="true">Nam</option>
                    <option value="false">Nữ</option>
                </select>
                <label>Giới tính</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="file" name="anhFile" class="form-control" id="anhFile">
                <label for="anhFile">Ảnh nhân viên</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="email" th:field="*{email}" class="form-control" placeholder="Email" required>
                <label>Email</label>
            </div>

            <div class="col-md-6 form-floating">
                <input type="password" th:field="*{matKhau}" class="form-control" placeholder="Mật khẩu" required>
                <label>Mật khẩu</label>
            </div>

            <div class="col-md-6 form-floating">
                <select th:field="*{chucVu}" class="form-select" required>
                    <option value="0">Quản lý</option>
                    <option value="1">Nhân viên</option>
                </select>
                <label>Chức vụ</label>
            </div>

            <div class="col-md-6 form-floating">
                <select th:field="*{trangThai}" class="form-select" required>
                    <option value="true">Hoạt động</option>
                    <option value="false">Khoá</option>
                </select>
                <label>Trạng thái</label>
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <a th:href="@{/admin/quanlytaikhoan/nhanvien}" class="btn btn-secondary">Quay lại</a>
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>
</section>
</body>
</html>
