<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<section layout:fragment="content" class="container my-5">

    <h2 class="text-center mb-4">Thêm Nhân Viên</h2>

    <form th:action="@{/admin/quanlytaikhoan/nhanvien/save}"
          th:object="${nhanvien}"
          method="post"
          enctype="multipart/form-data">
        <div class="row g-3">

            <!-- Mã NV -->
            <div class="col-md-6 form-floating">
                <input type="text"
                       th:field="*{ma}"
                       class="form-control"
                       placeholder="Mã (NV#####)"
                       required>
                <label>Mã</label>
                <div th:if="${#fields.hasErrors('ma')}"
                     th:errors="*{ma}"
                     class="text-danger small"></div>
            </div>

            <!-- Tên -->
            <div class="col-md-6 form-floating">
                <input type="text"
                       th:field="*{ten}"
                       class="form-control"
                       placeholder="Tên"
                       required>
                <label>Tên</label>
                <div th:if="${#fields.hasErrors('ten')}"
                     th:errors="*{ten}"
                     class="text-danger small"></div>
            </div>

            <!-- Ngày sinh -->
            <div class="col-md-6 form-floating">
                <input type="date"
                       th:field="*{ngaySinh}"
                       class="form-control"
                       placeholder="Ngày sinh"
                       required>
                <label>Ngày sinh</label>
                <div th:if="${#fields.hasErrors('ngaySinh')}"
                     th:errors="*{ngaySinh}"
                     class="text-danger small"></div>
            </div>

            <!-- Số điện thoại -->
            <div class="col-md-6 form-floating">
                <input type="text"
                       th:field="*{soDienThoai}"
                       class="form-control"
                       placeholder="Số điện thoại"
                       required>
                <label>Số điện thoại</label>
                <div th:if="${#fields.hasErrors('soDienThoai')}"
                     th:errors="*{soDienThoai}"
                     class="text-danger small"></div>
            </div>

            <!-- Ngày tham gia (ẩn) -->
            <input type="hidden" th:field="*{ngayThamGia}"/>

            <!-- CMND -->
            <div class="col-md-6 form-floating">
                <input type="text"
                       th:field="*{chungMinhThu}"
                       class="form-control"
                       placeholder="CMND"
                       required>
                <label>CMND</label>
                <div th:if="${#fields.hasErrors('chungMinhThu')}"
                     th:errors="*{chungMinhThu}"
                     class="text-danger small"></div>
            </div>

            <!-- Giới tính -->
            <div class="col-md-6 form-floating">
                <select th:field="*{gioiTinh}"
                        class="form-select"
                        required>
                    <option value="true">Nam</option>
                    <option value="false">Nữ</option>
                </select>
                <label>Giới tính</label>
            </div>

            <!-- Ảnh -->
            <div class="col-md-6 form-floating">
                <input type="file"
                       name="anhFile"
                       class="form-control"
                       id="anhFile">
                <label for="anhFile">Ảnh nhân viên</label>
            </div>

            <!-- Email -->
            <div class="col-md-6 form-floating">
                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       placeholder="Email"
                       required>
                <label>Email</label>
                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"
                     class="text-danger small"></div>
            </div>

            <!-- Mật khẩu với toggle -->
            <div class="col-md-6">
                <div class="form-floating position-relative">
                    <input th:type="${passwordVisible} ? 'text' : 'password'"
                           th:field="*{matKhau}"
                           id="matKhauInput"
                           class="form-control"
                           placeholder="Mật khẩu"
                           required>
                    <label for="matKhauInput">Mật khẩu</label>
                    <button type="button"
                            class="btn btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2 border-0"
                            style="z-index: 10"
                            onclick="togglePasswordVisibility()">
                        <i class="bi" id="eyeIcon"
                           th:classappend="${passwordVisible} ? 'bi-eye-slash' : 'bi-eye'"></i>
                    </button>
                </div>
                <div th:if="${#fields.hasErrors('matKhau')}"
                     th:errors="*{matKhau}"
                     class="text-danger small mt-1"></div>
            </div>

            <!-- Chức vụ -->
            <div class="col-md-6 form-floating">
                <select th:field="*{chucVu}"
                        class="form-select"
                        required>
                    <option value="0">Quản lý</option>
                    <option value="1">Nhân viên</option>
                </select>
                <label>Chức vụ</label>
                <div th:if="${#fields.hasErrors('chucVu')}"
                     th:errors="*{chucVu}"
                     class="text-danger small"></div>
            </div>

            <!-- Trạng thái -->
            <div class="col-md-6 form-floating">
                <select th:field="*{trangThai}"
                        class="form-select"
                        required>
                    <option value="true">Hoạt động</option>
                    <option value="false">Ngưng hoạt động</option>
                </select>
                <label>Trạng thái</label>
                <div th:if="${#fields.hasErrors('trangThai')}"
                     th:errors="*{trangThai}"
                     class="text-danger small"></div>
            </div>
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <a th:href="@{/admin/quanlytaikhoan/nhanvien}" class="btn btn-secondary">Quay lại</a>
            <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
    </form>

    <!-- Toggle password script -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        function togglePasswordVisibility() {
            const input = document.getElementById("matKhauInput");
            const icon = document.getElementById("eyeIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");
            }
        }
        /*]]>*/
    </script>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
