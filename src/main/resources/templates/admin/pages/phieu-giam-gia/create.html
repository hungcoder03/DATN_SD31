<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm Phiếu Giảm Giá</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            prefix: 'tw-',
            theme: {
                extend: {
                    colors: {
                        'project-primary': '#dead6f',
                        'project-primary-dark': '#c19b5b',
                        'project-primary-light': '#f0d4a0',
                        'project-gray': '#f8f9fa',
                        'project-dark': '#2c3e50'
                    }
                }
            }
        }
    </script>
</head>
<body class="tw-bg-gray-50">
<section layout:fragment="content">
    <div class="tw-min-h-screen tw-bg-gradient-to-br tw-from-gray-50 tw-to-gray-100 tw-py-8 tw-px-4">
        <div class="tw-max-w-4xl tw-mx-auto">
            <!-- Header -->
            <div class="tw-text-center tw-mb-8">
                <h1 class="tw-text-3xl tw-font-semibold tw-text-project-dark tw-mb-2">Thêm Phiếu Giảm Giá</h1>
                <p class="tw-text-gray-600">Điền thông tin chi tiết cho phiếu giảm giá mới</p>
            </div>

            <!-- Main Form Card -->
            <div class="tw-bg-white tw-rounded-2xl tw-shadow-xl tw-border tw-border-gray-100 tw-overflow-hidden">
                <form th:action="@{/admin/phieu-giam-gia/create}" th:object="${phieuGiamGia}" method="post" class="tw-p-8">
                    <!-- Thông tin cơ bản -->
                    <div class="tw-mb-8">
                        <h2 class="tw-text-xl tw-font-semibold tw-text-project-dark tw-mb-6 tw-flex tw-items-center">
                            <i class="fas fa-info-circle tw-mr-3 tw-text-project-primary"></i>
                            Thông Tin Cơ Bản
                        </h2>

                        <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-2 tw-gap-6">
                            <!-- Mã -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Mã phiếu</label>
                                <input type="text" th:field="*{ma}" id="maInput"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       placeholder="Để trống để tự sinh mã PGG******">
                                <p class="tw-text-sm tw-text-gray-500 tw-mt-1">Hệ thống sẽ tự tạo mã PGG + 6 chữ số nếu để trống</p>
                                <div id="maMessage" class="tw-text-sm tw-mt-1"></div>
                            </div>

                            <!-- Tên -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Tên phiếu giảm giá <span class="tw-text-red-500">*</span></label>
                                <input type="text" th:field="*{ten}"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       required placeholder="Nhập tên phiếu giảm giá">
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('ten')}" th:errors="*{ten}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Cấu hình giảm giá -->
                    <div class="tw-mb-8">
                        <h2 class="tw-text-xl tw-font-semibold tw-text-project-dark tw-mb-6 tw-flex tw-items-center">
                            <i class="fas fa-percent tw-mr-3 tw-text-project-primary"></i>
                            Cấu Hình Giảm Giá
                        </h2>

                        <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-3 tw-gap-6">
                            <!-- Loại phiếu giảm giá -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Loại phiếu giảm giá</label>
                                <select id="loaiPhieuGiamGia" th:field="*{loaiPhieuGiamGia}" 
                                        class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                        onchange="handleLoaiPhieuChange()">
                                    <option value="1">Phần trăm</option>
                                    <option value="2">Tiền mặt</option>
                                </select>
                            </div>

                            <!-- Mức độ giảm giá -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Mức độ giảm giá <span class="tw-text-red-500">*</span></label>
                                <input type="number" id="mucDo" th:field="*{mucDo}" step="0.01" min="0"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       required placeholder="Nhập mức độ giảm giá">
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('mucDo')}" th:errors="*{mucDo}"></div>
                            </div>

                            <!-- Giảm tối đa -->
                            <div id="divGiamToiDa">
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Giảm tối đa</label>
                                <input type="number" id="giamToiDa" th:field="*{giamToiDa}" step="1000" min="0"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       placeholder="Nhập giảm tối đa">
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('giamToiDa')}" th:errors="*{giamToiDa}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Điều kiện và thời gian -->
                    <div class="tw-mb-8">
                        <h2 class="tw-text-xl tw-font-semibold tw-text-project-dark tw-mb-6 tw-flex tw-items-center">
                            <i class="fas fa-clock tw-mr-3 tw-text-project-primary"></i>
                            Điều Kiện Và Thời Gian
                        </h2>

                        <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-3 tw-gap-6">
                            <!-- Điều kiện -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Điều kiện áp dụng <span class="tw-text-red-500">*</span></label>
                                <input type="number" th:field="*{dieuKien}" step="1000" min="0"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       required placeholder="Giá trị đơn hàng tối thiểu">
                                <p class="tw-text-sm tw-text-gray-500 tw-mt-1">Đơn hàng phải có giá trị tối thiểu này</p>
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('dieuKien')}" th:errors="*{dieuKien}"></div>
                            </div>

                            <!-- Ngày bắt đầu -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Ngày bắt đầu <span class="tw-text-red-500">*</span></label>
                                <input type="date" th:field="*{ngayBatDau}"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       required>
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"></div>
                            </div>

                            <!-- Ngày kết thúc -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Ngày kết thúc <span class="tw-text-red-500">*</span></label>
                                <input type="date" th:field="*{ngayKetThuc}"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       required>
                                <div class="tw-text-sm tw-text-red-600 tw-mt-1" th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Cài đặt khác -->
                    <div class="tw-mb-8">
                        <h2 class="tw-text-xl tw-font-semibold tw-text-project-dark tw-mb-6 tw-flex tw-items-center">
                            <i class="fas fa-cog tw-mr-3 tw-text-project-primary"></i>
                            Cài Đặt Khác
                        </h2>

                        <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-2 tw-gap-6">
                            <!-- Số lượng -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Số lượng</label>
                                <input type="number" th:field="*{soLuongTon}" min="1"
                                       class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-project-primary focus:tw-border-project-primary"
                                       placeholder="Số lượng phiếu có sẵn">
                                <p class="tw-text-sm tw-text-gray-500 tw-mt-1">Để trống nếu không giới hạn số lượng</p>
                            </div>

                            <!-- Trạng thái -->
                            <div>
                                <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Trạng thái</label>
                                <div class="tw-flex tw-space-x-4">
                                    <label class="tw-flex tw-items-center">
                                        <input type="radio" th:field="*{trangThai}" th:value="true"
                                               class="tw-w-4 tw-h-4 tw-text-project-primary tw-border-gray-300 focus:tw-ring-project-primary">
                                        <span class="tw-ml-2 tw-text-sm tw-text-gray-700">Hoạt động</span>
                                    </label>
                                    <label class="tw-flex tw-items-center">
                                        <input type="radio" th:field="*{trangThai}" th:value="false"
                                               class="tw-w-4 tw-h-4 tw-text-project-primary tw-border-gray-300 focus:tw-ring-project-primary">
                                        <span class="tw-ml-2 tw-text-sm tw-text-gray-700">Không hoạt động</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="tw-flex tw-justify-end tw-space-x-4 tw-pt-6 tw-border-t tw-border-gray-200">
                        <a href="/admin/phieu-giam-gia" 
                           class="tw-px-6 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-gray-700 tw-bg-white hover:tw-bg-gray-50 tw-transition-colors">
                            Hủy
                        </a>
                        <button type="submit" 
                                class="tw-px-6 tw-py-2 tw-bg-project-primary tw-text-white tw-rounded-lg hover:tw-bg-project-primary-dark tw-transition-colors">
                            <i class="fas fa-save tw-mr-2"></i>Thêm mới
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<script>
function handleLoaiPhieuChange() {
    const loaiPhieu = document.getElementById('loaiPhieuGiamGia').value;
    const mucDo = document.getElementById('mucDo');
    const divGiamToiDa = document.getElementById('divGiamToiDa');
    
    if (loaiPhieu === '1') { // Phần trăm
        mucDo.placeholder = 'Nhập phần trăm (1-100)';
        mucDo.min = '1';
        mucDo.max = '100';
        divGiamToiDa.style.display = 'block';
    } else if (loaiPhieu === '2') { // Tiền mặt
        mucDo.placeholder = 'Nhập số tiền giảm';
        mucDo.min = '0';
        mucDo.max = '';
        divGiamToiDa.style.display = 'none';
    }
}

// Khởi tạo khi trang load
document.addEventListener('DOMContentLoaded', function() {
    handleLoaiPhieuChange();
});
</script>

</body>
</html>
