<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm Phiếu Giảm Giá</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            prefix: 'tw-',
            theme: {
                extend: {
                    colors: {
                        'primary': '#3b82f6',
                        'primary-dark': '#2563eb',
                        'primary-light': '#93c5fd',
                        'success': '#10b981',
                        'warning': '#f59e0b',
                        'error': '#ef4444',
                        'gray-50': '#f9fafb'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'bounce-in': 'bounceIn 0.6s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .form-group {
            animation: slideUp 0.5s ease-out;
        }

        .floating-label {
            position: relative;
        }

        .floating-label input:focus + label,
        .floating-label input:not(:placeholder-shown) + label,
        .floating-label select:focus + label {
            transform: translateY(-1.5rem) scale(0.875);
            color: #3b82f6;
        }

        .floating-label label {
            position: absolute;
            left: 0.75rem;
            top: 0.75rem;
            color: #6b7280;
            pointer-events: none;
            transition: all 0.2s ease-in-out;
            background: white;
            padding: 0 0.25rem;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .input-focus {
            transition: all 0.3s ease;
        }

        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="tw-bg-gradient-to-br tw-from-gray-50 tw-to-blue-50">

<section layout:fragment="content">
    <!-- Background Decoration -->
    <div class="tw-fixed tw-inset-0 tw-pointer-events-none">
        <div class="tw-absolute tw-top-10 tw-right-10 tw-w-72 tw-h-72 tw-bg-blue-200 tw-rounded-full tw-opacity-20 tw-blur-3xl"></div>
        <div class="tw-absolute tw-bottom-10 tw-left-10 tw-w-96 tw-h-96 tw-bg-purple-200 tw-rounded-full tw-opacity-20 tw-blur-3xl"></div>
    </div>

    <div class="tw-min-h-screen tw-py-8 tw-px-4 tw-relative">
        <div class="tw-max-w-5xl tw-mx-auto">
            <!-- Header -->
            <div class="tw-text-center tw-mb-10 tw-animate-fade-in">
                <div class="tw-inline-flex tw-items-center tw-justify-center tw-w-16 tw-h-16 tw-bg-gradient-to-r tw-from-blue-500 tw-to-purple-600 tw-rounded-full tw-mb-6 tw-animate-bounce-in">
                    <i class="fas fa-ticket-alt tw-text-2xl tw-text-white"></i>
                </div>
                <h1 class="tw-text-4xl tw-font-bold tw-bg-gradient-to-r tw-from-blue-600 tw-to-purple-600 tw-bg-clip-text tw-text-transparent tw-mb-3">
                    Tạo Phiếu Giảm Giá Mới
                </h1>
                <p class="tw-text-gray-600 tw-text-lg">Điền thông tin chi tiết để tạo phiếu giảm giá hấp dẫn</p>
            </div>

            <!-- Main Form Card -->
            <div class="tw-bg-white/80 tw-backdrop-blur-sm tw-rounded-3xl tw-shadow-2xl tw-border tw-border-white/20 tw-overflow-hidden hover-lift">
                <div class="tw-bg-gradient-to-r tw-from-blue-500 tw-to-purple-600 tw-p-1">
                    <div class="tw-bg-white tw-rounded-3xl tw-p-8">
                        <form th:action="@{/admin/phieu-giam-gia/create}" th:object="${phieuGiamGia}" method="post" id="voucherForm">

                            <!-- Error Display -->
                            <div th:if="${error}" class="tw-mb-6 tw-p-4 tw-bg-red-50 tw-border tw-border-red-200 tw-rounded-xl tw-text-red-700">
                                <i class="fas fa-exclamation-triangle tw-mr-2"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <!-- Thông tin cơ bản -->
                            <div class="tw-mb-10 form-group">
                                <div class="tw-flex tw-items-center tw-mb-6">
                                    <div class="tw-w-8 tw-h-8 tw-bg-blue-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mr-3">
                                        <i class="fas fa-info-circle tw-text-blue-600 tw-text-sm"></i>
                                    </div>
                                    <h2 class="tw-text-2xl tw-font-semibold tw-text-gray-800">Thông Tin Cơ Bản</h2>
                                </div>

                                <div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-2 tw-gap-8">
                                    <!-- Mã -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">Mã phiếu</label>
                                        <input type="text" th:field="*{ma}" id="maInput"
                                               class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                               placeholder="Để trống để tự sinh mã PGG******">
                                        <p class="tw-text-xs tw-text-gray-500 tw-flex tw-items-center">
                                            <i class="fas fa-lightbulb tw-mr-1 tw-text-yellow-500"></i>
                                            Hệ thống sẽ tự tạo mã PGG + 6 chữ số nếu để trống
                                        </p>
                                    </div>

                                    <!-- Tên -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">
                                            Tên phiếu giảm giá <span class="tw-text-red-500">*</span>
                                        </label>
                                        <input type="text" th:field="*{ten}" required
                                               class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                               placeholder="Nhập tên phiếu giảm giá">
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('ten')}" th:errors="*{ten}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Cấu hình giảm giá -->
                            <div class="tw-mb-10 form-group">
                                <div class="tw-flex tw-items-center tw-mb-6">
                                    <div class="tw-w-8 tw-h-8 tw-bg-green-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mr-3">
                                        <i class="fas fa-percent tw-text-green-600 tw-text-sm"></i>
                                    </div>
                                    <h2 class="tw-text-2xl tw-font-semibold tw-text-gray-800">Cấu Hình Giảm Giá</h2>
                                </div>

                                <div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-3 tw-gap-8">
                                    <!-- Loại phiếu -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">Loại phiếu giảm giá</label>
                                        <select id="loaiPhieuGiamGia" th:field="*{loaiPhieuGiamGia}"
                                                class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                                onchange="handleLoaiPhieuChange()">
                                            <option value="1">🏷️ Phần trăm</option>
                                            <option value="2">💰 Tiền mặt</option>
                                        </select>
                                    </div>

                                    <!-- Mức độ -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">
                                            Mức độ giảm giá <span class="tw-text-red-500">*</span>
                                        </label>
                                        <div class="tw-relative">
                                            <input type="number" id="mucDo" th:field="*{mucDo}" step="0.01" min="0" required
                                                   class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                                   placeholder="Nhập mức độ giảm giá">
                                            <div id="mucDoUnit" class="tw-absolute tw-right-3 tw-top-3 tw-text-gray-500 tw-text-sm">%</div>
                                        </div>
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('mucDo')}" th:errors="*{mucDo}"></div>
                                    </div>

                                    <!-- Giảm tối đa -->
                                    <div id="divGiamToiDa" class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">Giảm tối đa</label>
                                        <div class="tw-relative">
                                            <input type="number" id="giamToiDa" th:field="*{giamToiDa}" step="1000" min="0"
                                                   class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                                   placeholder="Nhập giảm tối đa">
                                            <div class="tw-absolute tw-right-3 tw-top-3 tw-text-gray-500 tw-text-sm">VNĐ</div>
                                        </div>
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('giamToiDa')}" th:errors="*{giamToiDa}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Điều kiện và thời gian -->
                            <div class="tw-mb-10 form-group">
                                <div class="tw-flex tw-items-center tw-mb-6">
                                    <div class="tw-w-8 tw-h-8 tw-bg-purple-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mr-3">
                                        <i class="fas fa-clock tw-text-purple-600 tw-text-sm"></i>
                                    </div>
                                    <h2 class="tw-text-2xl tw-font-semibold tw-text-gray-800">Điều Kiện Và Thời Gian</h2>
                                </div>

                                <div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-3 tw-gap-8">
                                    <!-- Điều kiện -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">
                                            Điều kiện áp dụng <span class="tw-text-red-500">*</span>
                                        </label>
                                        <div class="tw-relative">
                                            <input type="number" th:field="*{dieuKien}" step="1000" min="0" required
                                                   class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                                   placeholder="Giá trị đơn hàng tối thiểu">
                                            <div class="tw-absolute tw-right-3 tw-top-3 tw-text-gray-500 tw-text-sm">VNĐ</div>
                                        </div>
                                        <p class="tw-text-xs tw-text-gray-500 tw-flex tw-items-center">
                                            <i class="fas fa-shopping-cart tw-mr-1 tw-text-blue-500"></i>
                                            Đơn hàng phải có giá trị tối thiểu này
                                        </p>
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('dieuKien')}" th:errors="*{dieuKien}"></div>
                                    </div>

                                    <!-- Ngày bắt đầu -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">
                                            Ngày bắt đầu <span class="tw-text-red-500">*</span>
                                        </label>
                                        <input type="date" th:field="*{ngayBatDau}" required
                                               class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                               th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('ngayBatDau')}" th:errors="*{ngayBatDau}"></div>
                                    </div>

                                    <!-- Ngày kết thúc -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">
                                            Ngày kết thúc <span class="tw-text-red-500">*</span>
                                        </label>
                                        <input type="date" th:field="*{ngayKetThuc}" required
                                               class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus">
                                        <div class="tw-text-sm tw-text-red-600" th:if="${#fields.hasErrors('ngayKetThuc')}" th:errors="*{ngayKetThuc}"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Cài đặt khác -->
                            <div class="tw-mb-10 form-group">
                                <div class="tw-flex tw-items-center tw-mb-6">
                                    <div class="tw-w-8 tw-h-8 tw-bg-orange-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mr-3">
                                        <i class="fas fa-cog tw-text-orange-600 tw-text-sm"></i>
                                    </div>
                                    <h2 class="tw-text-2xl tw-font-semibold tw-text-gray-800">Cài Đặt Khác</h2>
                                </div>

                                <div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-2 tw-gap-8">
                                    <!-- Số lượng -->
                                    <div class="tw-space-y-2">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">Số lượng</label>
                                        <input type="number" th:field="*{soLuongTon}" min="1" step="1"
                                               class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-xl tw-text-sm input-focus"
                                               placeholder="Số lượng phiếu có sẵn">
                                        <p class="tw-text-xs tw-text-gray-500 tw-flex tw-items-center">
                                            <i class="fas fa-infinity tw-mr-1 tw-text-green-500"></i>
                                            Để trống nếu không giới hạn số lượng
                                        </p>
                                    </div>

                                    <!-- Trạng thái -->
                                    <div class="tw-space-y-4">
                                        <label class="tw-block tw-text-sm tw-font-medium tw-text-gray-700">Trạng thái</label>
                                        <div class="tw-flex tw-space-x-6">
                                            <label class="tw-flex tw-items-center tw-cursor-pointer tw-group">
                                                <input type="radio" th:field="*{trangThai}" th:value="true"
                                                       class="tw-w-4 tw-h-4 tw-text-blue-600 tw-border-gray-300 focus:tw-ring-blue-500">
                                                <div class="tw-ml-3 tw-flex tw-items-center">
                                                    <div class="tw-w-2 tw-h-2 tw-bg-green-500 tw-rounded-full tw-mr-2"></div>
                                                    <span class="tw-text-sm tw-text-gray-700 group-hover:tw-text-gray-900">Hoạt động</span>
                                                </div>
                                            </label>
                                            <label class="tw-flex tw-items-center tw-cursor-pointer tw-group">
                                                <input type="radio" th:field="*{trangThai}" th:value="false"
                                                       class="tw-w-4 tw-h-4 tw-text-red-600 tw-border-gray-300 focus:tw-ring-red-500">
                                                <div class="tw-ml-3 tw-flex tw-items-center">
                                                    <div class="tw-w-2 tw-h-2 tw-bg-red-500 tw-rounded-full tw-mr-2"></div>
                                                    <span class="tw-text-sm tw-text-gray-700 group-hover:tw-text-gray-900">Không hoạt động</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="tw-flex tw-justify-end tw-space-x-4 tw-pt-8 tw-border-t tw-border-gray-100">
                                <a href="/admin/phieu-giam-gia"
                                   class="tw-px-8 tw-py-3 tw-border-2 tw-border-gray-300 tw-rounded-xl tw-text-gray-700 tw-bg-white hover:tw-bg-gray-50 tw-transition-all tw-duration-300 tw-flex tw-items-center tw-font-medium">
                                    <i class="fas fa-times tw-mr-2"></i>Hủy
                                </a>
                                <button type="submit"
                                        class="tw-px-8 tw-py-3 tw-bg-gradient-to-r tw-from-blue-500 tw-to-purple-600 tw-text-white tw-rounded-xl hover:tw-from-blue-600 hover:tw-to-purple-700 tw-transition-all tw-duration-300 tw-flex tw-items-center tw-font-medium tw-shadow-lg hover:tw-shadow-xl tw-transform hover:tw-scale-105">
                                    <i class="fas fa-save tw-mr-2"></i>Tạo phiếu giảm giá
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin/phieu-giam-gia.js}"></script>
    <script>
        // Enhanced form validation and UX
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('voucherForm');
            const loaiPhieu = document.getElementById('loaiPhieuGiamGia');
            const mucDo = document.getElementById('mucDo');
            const mucDoUnit = document.getElementById('mucDoUnit');
            const divGiamToiDa = document.getElementById('divGiamToiDa');
            const ngayBatDau = document.querySelector('input[name="ngayBatDau"]');
            const ngayKetThuc = document.querySelector('input[name="ngayKetThuc"]');

            // Set min date for start date (today)
            const today = new Date().toISOString().split('T')[0];
            ngayBatDau.min = today;

            // Update end date min when start date changes
            ngayBatDau.addEventListener('change', function() {
                ngayKetThuc.min = this.value;
                if (ngayKetThuc.value && ngayKetThuc.value <= this.value) {
                    ngayKetThuc.value = '';
                }
            });

            // Initialize form
            handleLoaiPhieuChange();

            // Real-time validation
            mucDo.addEventListener('input', function() {
                validateMucDo();
            });

            // Form submission with loading state
            form.addEventListener('submit', function(e) {
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin tw-mr-2"></i>Đang tạo...';
                submitBtn.disabled = true;
            });
        });

        function handleLoaiPhieuChange() {
            const loaiPhieu = document.getElementById('loaiPhieuGiamGia').value;
            const mucDo = document.getElementById('mucDo');
            const mucDoUnit = document.getElementById('mucDoUnit');
            const divGiamToiDa = document.getElementById('divGiamToiDa');
            const giamToiDa = document.getElementById('giamToiDa');

            if (loaiPhieu === '1') { // Phần trăm
                mucDo.placeholder = 'Nhập phần trăm (1-100)';
                mucDo.min = '1';
                mucDo.max = '100';
                mucDo.step = '0.01';
                mucDoUnit.textContent = '%';
                divGiamToiDa.style.display = 'block';
                giamToiDa.required = true;
            } else if (loaiPhieu === '2') { // Tiền mặt
                mucDo.placeholder = 'Nhập số tiền giảm';
                mucDo.min = '1000';
                mucDo.max = '';
                mucDo.step = '1000';
                mucDoUnit.textContent = 'VNĐ';
                divGiamToiDa.style.display = 'none';
                giamToiDa.required = false;
            }

            mucDo.value = '';
            validateMucDo();
        }

        function validateMucDo() {
            const loaiPhieu = document.getElementById('loaiPhieuGiamGia').value;
            const mucDo = document.getElementById('mucDo');
            const value = parseFloat(mucDo.value);

            // Remove previous validation classes
            mucDo.classList.remove('tw-border-red-500', 'tw-border-green-500');

            if (!value) return;

            let isValid = true;

            if (loaiPhieu === '1') { // Phần trăm
                isValid = value >= 1 && value <= 100;
            } else if (loaiPhieu === '2') { // Tiền mặt
                isValid = value >= 1000;
            }

            if (isValid) {
                mucDo.classList.add('tw-border-green-500');
            } else {
                mucDo.classList.add('tw-border-red-500');
            }
        }

        // Format number inputs with thousand separators
        function formatNumber(input) {
            let value = input.value.replace(/\D/g, '');
            input.value = new Intl.NumberFormat('vi-VN').format(value);
        }

        // Add input formatting for currency fields
        document.querySelectorAll('input[type="number"]').forEach(input => {
            if (input.step === '1000' || input.name === 'dieuKien' || input.name === 'giamToiDa') {
                input.addEventListener('blur', function() {
                    if (this.value) {
                        this.value = Math.round(this.value);
                    }
                });
            }
        });
    </script>

</section>



</body>
</html>
