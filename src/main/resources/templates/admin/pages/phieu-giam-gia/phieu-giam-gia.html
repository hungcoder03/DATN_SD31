<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">

<head>
    <title>Quản lý Phiếu giảm giá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            prefix: 'tw-',
            theme: {
                extend: {
                    colors: {
                        'project-primary': '#dead6f',
                        'project-primary-dark': '#c19b5b',
                        'project-primary-light': '#f0d4a0',
                        'project-gray': '#f8f9fa',
                        'project-dark': '#2c3e50'
                    }
                }
            }
        }
    </script>
</head>
<body>
<section layout:fragment="content">
    <div class="tw-p-6 tw-space-y-6">
        <!-- Header -->
        <div class="tw-flex tw-items-center tw-justify-between">
            <div>
                <h1 class="tw-text-2xl tw-font-bold tw-text-gray-900">Quản lý Phiếu giảm giá</h1>
                <p class="tw-text-sm tw-text-gray-600">Tạo và quản lý các phiếu giảm giá cho khách hàng</p>
            </div>
            <a th:href="@{/admin/phieu-giam-gia/create}" class="tw-bg-project-primary tw-text-white tw-rounded-lg tw-px-4 tw-py-2 tw-text-sm hover:tw-bg-project-primary-dark tw-transition-colors">
                + Thêm phiếu giảm giá
            </a>
        </div>

        <!-- Filter Section -->
        <div class="tw-bg-white tw-rounded-lg tw-shadow-sm tw-border tw-border-gray-200 tw-p-6">
            <h3 class="tw-font-semibold tw-text-gray-900 tw-mb-4">Bộ lọc tìm kiếm</h3>
            <form th:action="@{/admin/phieu-giam-gia}" method="get" class="tw-space-y-4">
                <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-4 tw-gap-4">
                    <div>
                        <label for="startDate" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Ngày bắt đầu</label>
                        <input type="date" 
                               id="startDate" 
                               name="startDate" 
                               th:value="${startDate}"
                               class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-blue-500 focus:tw-border-blue-500">
                    </div>
                    <div>
                        <label for="endDate" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Ngày kết thúc</label>
                        <input type="date" 
                               id="endDate" 
                               name="endDate" 
                               th:value="${endDate}"
                               class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-blue-500 focus:tw-border-blue-500">
                    </div>
                    <div>
                        <label for="status" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Trạng thái</label>
                        <select id="status" 
                                name="status" 
                                th:value="${status}"
                                class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-ring-1 focus:tw-ring-blue-500 focus:tw-border-blue-500">
                            <option value="">Tất cả</option>
                            <option value="true" th:selected="${status == 'true'}">Hoạt động</option>
                            <option value="false" th:selected="${status == 'false'}">Không hoạt động</option>
                        </select>
                    </div>
                    <div class="tw-flex tw-items-end">
                        <button type="submit" class="tw-bg-blue-600 tw-text-white tw-rounded-lg tw-px-4 tw-py-2 tw-text-sm hover:tw-bg-blue-700 tw-transition-colors">
                            <i class="fas fa-search tw-mr-2"></i>Tìm kiếm
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Table Section -->
        <div class="tw-bg-white tw-rounded-lg tw-shadow-sm tw-border tw-border-gray-200 tw-overflow-hidden">
            <div class="tw-px-6 tw-py-4 tw-border-b tw-border-gray-200">
                <h3 class="tw-font-semibold tw-text-gray-900">Danh sách Phiếu giảm giá</h3>
                <p class="tw-text-sm tw-text-gray-600 tw-mt-1" th:text="${'Tổng cộng: ' + #lists.size(listData) + ' phiếu'}"></p>
            </div>
            
            <div class="tw-overflow-x-auto">
                <table class="tw-min-w-full tw-divide-y tw-divide-gray-200">
                    <thead class="tw-bg-gray-50">
                        <tr>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">#</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Mã</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Tên</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Giá trị</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Điều kiện</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Ngày bắt đầu</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Ngày kết thúc</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Trạng thái</th>
                            <th class="tw-px-6 tw-py-3 tw-text-left tw-text-xs tw-font-medium tw-text-gray-500 tw-uppercase tw-tracking-wider">Hành động</th>
                        </tr>
                    </thead>
                    <tbody class="tw-bg-white tw-divide-y tw-divide-gray-200">
                        <tr th:each="phieu, iterStat : ${listData}" class="hover:tw-bg-gray-50">
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900" th:text="${iterStat.count}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-font-medium tw-text-gray-900" th:text="${phieu.ma}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900" th:text="${phieu.ten}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900">
                                <span th:if="${phieu.loaiPhieuGiamGia == 1}" th:text="${phieu.mucDo + '%'}"></span>
                                <span th:if="${phieu.loaiPhieuGiamGia == 2}" th:text="${#numbers.formatDecimal(phieu.mucDo, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></span>
                            </td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900" th:text="${#numbers.formatDecimal(phieu.dieuKien, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900" th:text="${#temporals.format(phieu.ngayBatDau, 'dd/MM/yyyy')}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-text-gray-900" th:text="${#temporals.format(phieu.ngayKetThuc, 'dd/MM/yyyy')}"></td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap">
                                <span th:if="${phieu.trangThai}" 
                                      class="tw-inline-flex tw-px-2 tw-py-1 tw-text-xs tw-font-semibold tw-rounded-full tw-bg-green-100 tw-text-green-800">
                                    Hoạt động
                                </span>
                                <span th:unless="${phieu.trangThai}" 
                                      class="tw-inline-flex tw-px-2 tw-py-1 tw-text-xs tw-font-semibold tw-rounded-full tw-bg-red-100 tw-text-red-800">
                                    Không hoạt động
                                </span>
                            </td>
                            <td class="tw-px-6 tw-py-4 tw-whitespace-nowrap tw-text-sm tw-font-medium">
                                <a th:href="@{/admin/phieu-giam-gia/edit/{id}(id=${phieu.id})}"
                                   class="tw-text-project-primary hover:tw-text-project-primary-dark tw-mr-4 tw-transition-colors">
                                    <i class="fas fa-edit tw-mr-1"></i>Sửa
                                </a>
                                <a th:href="@{/admin/phieu-giam-gia/delete/{id}(id=${phieu.id})}"
                                   onclick="return confirm('Bạn có chắc muốn xóa phiếu giảm giá này không?')"
                                   class="tw-text-red-600 hover:tw-text-red-900 tw-transition-colors">
                                    <i class="fas fa-trash tw-mr-1"></i>Xóa
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

</body>
</html>
