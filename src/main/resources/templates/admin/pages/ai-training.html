<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý AI Training Data</title>
    <!-- Sử dụng Tailwind CSS với prefix để tránh xung đột -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
            },
            prefix: 'tw-',
        }
    </script>
    <style>
        /* Design System Variables */
        :root {
            --primary-color: #dead6f;
            --primary-hover: #c19b5b;
            --secondary-color: #6b7280;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Global Styles */
        .admin-page {
            background: var(--light-bg);
            min-height: 100vh;
        }

        .page-header {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--gray-200);
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0 0 8px 0;
        }

        .page-subtitle {
            font-size: 16px;
            color: var(--gray-600);
            margin: 0;
        }

        /* Form Styles */
        .form-container {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--gray-200);
        }

        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            background: var(--white);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(222, 173, 111, 0.1);
        }

        /* Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }

        .btn-secondary:hover {
            background: var(--gray-200);
            color: var(--gray-800);
        }

        .btn-success {
            background: var(--success-color);
            color: var(--white);
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: var(--danger-color);
            color: var(--white);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Table Styles */
        .table-container {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--gray-200);
        }

        .table-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: var(--white);
            padding: 20px 24px;
        }

        .table-header h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--gray-100);
        }

        .data-table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-700);
            font-size: 14px;
        }

        .data-table tr:hover {
            background: var(--gray-50);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Badge Styles */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #e0f2fe;
            color: #0369a1;
        }

        /* Alert Styles */
        .alert {
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--gray-500);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                padding: 16px;
            }
            
            .form-container {
                padding: 16px;
            }
            
            .data-table th,
            .data-table td {
                padding: 12px 16px;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content" class="admin-page">
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">Quản lý AI Training Data</h1>
                <p class="page-subtitle">Quản lý dữ liệu training cho AI Bot</p>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <!-- Training Data Form -->
            <div class="form-container">
                <h3 class="form-title" th:text="${isEdit ? 'Chỉnh sửa Training Data' : 'Thêm Training Data mới'}"></h3>
                <form th:action="@{/admin/ai-training/save}" th:object="${newTrainingData}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label for="question" class="form-label">Câu hỏi</label>
                        <textarea th:field="*{question}" id="question" class="form-control" rows="3" 
                                  placeholder="Nhập câu hỏi mẫu..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="answer" class="form-label">Câu trả lời</label>
                        <textarea th:field="*{answer}" id="answer" class="form-control" rows="4" 
                                  placeholder="Nhập câu trả lời mẫu..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="category" class="form-label">Danh mục</label>
                        <select th:field="*{category}" id="category" class="form-control">
                            <option value="">Chọn danh mục</option>
                            <option value="Sản phẩm">Sản phẩm</option>
                            <option value="Chính sách">Chính sách</option>
                            <option value="Phí giao hàng">Phí giao hàng</option>
                            <option value="Tư vấn mua hàng">Tư vấn mua hàng</option>
                            <option value="Chất liệu">Chất liệu</option>
                            <option value="Kích thước">Kích thước</option>
                            <option value="Khuyến mãi">Khuyến mãi</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Cập nhật Training Data' : 'Lưu Training Data'}"></button>
                        <a th:href="@{/admin/ai-training}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>

            <!-- Training Data Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>Danh sách Training Data</h3>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Câu hỏi</th>
                                <th>Câu trả lời</th>
                                <th>Danh mục</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="data : ${trainingData}">
                                <td th:text="${data.id}"></td>
                                <td th:text="${#strings.abbreviate(data.question, 50)}"></td>
                                <td th:text="${#strings.abbreviate(data.answer, 50)}"></td>
                                <td>
                                    <span class="badge badge-info" th:text="${data.category}"></span>
                                </td>
                                <td>
                                    <span th:if="${data.isActive}" class="badge badge-success">Hoạt động</span>
                                    <span th:unless="${data.isActive}" class="badge badge-danger">Không hoạt động</span>
                                </td>
                                <td>
                                    <div class="action-buttons">
                                        <a th:href="@{/admin/ai-training/edit/{id}(id=${data.id})}" class="btn btn-success btn-sm">Sửa</a>
                                        <form th:action="@{/admin/ai-training/delete/{id}(id=${data.id})}" method="post" style="display: inline-block;" 
                                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa training data này?')">
                                            <button type="submit" class="btn btn-danger btn-sm">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(trainingData)}">
                                <td colspan="6" class="empty-state">
                                    Chưa có training data nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
