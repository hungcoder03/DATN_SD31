<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Quản lý AI Training Data</title>
    <style>
        .training-form {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .training-data-table {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .table-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 20px 24px;
        }

        .table-header h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        .table-content {
            padding: 0;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid #f3f4f6;
        }

        .data-table th {
            background: #f9fafb;
            font-weight: 600;
            color: #374151;
        }

        .data-table tr:hover {
            background: #f9fafb;
        }

        .btn-edit,
        .btn-delete {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: #10b981;
            color: white;
            margin-right: 8px;
        }

        .btn-edit:hover {
            background: #059669;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-color: #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fecaca;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h1 class="page-title">Quản lý AI Training Data</h1>
                <p class="page-subtitle">Quản lý dữ liệu training cho AI Bot</p>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Training Data Form -->
        <div class="training-form">
            <h3>Thêm/Chỉnh sửa Training Data</h3>
            <form th:action="@{/admin/ai-training/save}" th:object="${newTrainingData}" method="post">
                <input type="hidden" th:field="*{id}" id="trainingDataId">
                
                <div class="form-group">
                    <label for="question" class="form-label">Câu hỏi</label>
                    <textarea th:field="*{question}" id="question" class="form-control" rows="3" 
                              placeholder="Nhập câu hỏi mẫu..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="answer" class="form-label">Câu trả lời</label>
                    <textarea th:field="*{answer}" id="answer" class="form-control" rows="4" 
                              placeholder="Nhập câu trả lời mẫu..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="category" class="form-label">Danh mục</label>
                    <select th:field="*{category}" id="category" class="form-control">
                        <option value="">Chọn danh mục</option>
                        <option value="Sản phẩm">Sản phẩm</option>
                        <option value="Chính sách">Chính sách</option>
                        <option value="Phí giao hàng">Phí giao hàng</option>
                        <option value="Tư vấn mua hàng">Tư vấn mua hàng</option>
                        <option value="Chất liệu">Chất liệu</option>
                        <option value="Kích thước">Kích thước</option>
                        <option value="Khuyến mãi">Khuyến mãi</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Lưu Training Data</button>
                <button type="button" class="btn-primary" id="resetBtn" style="margin-left: 12px;">Làm mới</button>
            </form>
        </div>

        <!-- Training Data Table -->
        <div class="training-data-table">
            <div class="table-header">
                <h3>Danh sách Training Data</h3>
            </div>
            <div class="table-content">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Câu hỏi</th>
                            <th>Câu trả lời</th>
                            <th>Danh mục</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="data : ${trainingData}">
                            <td th:text="${data.id}"></td>
                            <td th:text="${#strings.abbreviate(data.question, 50)}"></td>
                            <td th:text="${#strings.abbreviate(data.answer, 50)}"></td>
                            <td>
                                <span class="category-badge" th:text="${data.category}"></span>
                            </td>
                            <td>
                                <span th:if="${data.isActive}" class="badge badge-success">Hoạt động</span>
                                <span th:unless="${data.isActive}" class="badge badge-danger">Không hoạt động</span>
                            </td>
                            <td>
                                <button class="btn-edit" data-id="${data.id}">Sửa</button>
                                <button class="btn-delete" data-id="${data.id}">Xóa</button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(trainingData)}">
                            <td colspan="6" style="text-align: center; padding: 40px; color: #6b7280;">
                                Chưa có training data nào
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Chỉnh sửa Training Data</h3>
                <form id="editForm" method="post">
                    <input type="hidden" id="editId" name="id">
                    
                    <div class="form-group">
                        <label for="editQuestion" class="form-label">Câu hỏi</label>
                        <textarea id="editQuestion" name="question" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="editAnswer" class="form-label">Câu trả lời</label>
                        <textarea id="editAnswer" name="answer" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="editCategory" class="form-label">Danh mục</label>
                        <select id="editCategory" name="category" class="form-control">
                            <option value="">Chọn danh mục</option>
                            <option value="Sản phẩm">Sản phẩm</option>
                            <option value="Chính sách">Chính sách</option>
                            <option value="Phí giao hàng">Phí giao hàng</option>
                            <option value="Tư vấn mua hàng">Tư vấn mua hàng</option>
                            <option value="Chất liệu">Chất liệu</option>
                            <option value="Kích thước">Kích thước</option>
                            <option value="Khuyến mãi">Khuyến mãi</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Cập nhật</button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Modal functionality
            var modal = document.getElementById('editModal');
            var span = document.getElementsByClassName('close')[0];

            span.onclick = function() {
                modal.style.display = 'none';
            }

            window.onclick = function(event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }

            // Reset form button
            var resetBtn = document.getElementById('resetBtn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function() {
                    resetForm();
                });
            }

            // Edit buttons - use event delegation for dynamic content
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('btn-edit')) {
                    var id = e.target.getAttribute('data-id');
                    editTrainingData(id);
                }
                
                if (e.target.classList.contains('btn-delete')) {
                    var id = e.target.getAttribute('data-id');
                    deleteTrainingData(id);
                }
            });

            // Functions
            function editTrainingData(id) {
                // Fetch training data by ID
                fetch('/admin/ai-training/edit/' + id)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('editId').value = data.id;
                        document.getElementById('editQuestion').value = data.question;
                        document.getElementById('editAnswer').value = data.answer;
                        document.getElementById('editCategory').value = data.category;
                        
                        modal.style.display = 'block';
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Có lỗi xảy ra khi tải dữ liệu');
                    });
            }

            function deleteTrainingData(id) {
                if (confirm('Bạn có chắc chắn muốn xóa training data này?')) {
                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/admin/ai-training/delete/' + id;
                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);
                }
            }

            function resetForm() {
                document.getElementById('trainingDataId').value = '';
                document.getElementById('question').value = '';
                document.getElementById('answer').value = '';
                document.getElementById('category').value = '';
            }

            // Handle edit form submission
            var editForm = document.getElementById('editForm');
            if (editForm) {
                editForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    var formData = new FormData(this);
                    var data = {
                        id: formData.get('id'),
                        question: formData.get('question'),
                        answer: formData.get('answer'),
                        category: formData.get('category')
                    };

                    fetch('/admin/ai-training/save', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify(data)
                    })
                    .then(response => {
                        if (response.ok) {
                            modal.style.display = 'none';
                            location.reload();
                        } else {
                            alert('Có lỗi xảy ra khi cập nhật');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Có lỗi xảy ra khi cập nhật');
                    });
                });
            }
        });
    </script>
</body>
</html>
