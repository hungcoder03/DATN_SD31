<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Chat với khách hàng</title>
    <style>
        .chat-container { width: 100%; height: 80vh; background:#fff; display:flex; box-shadow: 0 1px 1px rgba(0,0,0,0.06); border-radius: 6px; overflow:hidden; }
        .sidebar { width: 32%; border-right:1px solid #e9edef; background:#1f2937; display:flex; flex-direction:column; }
        .header { background:transparent; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; }
        .search-bar { background:transparent; padding:8px 12px; border-bottom:1px solid rgba(233,237,239,0.2); }
        .search-input { width:100%; padding:8px 12px; background:rgba(255,255,255,0.12); border:none; border-radius:8px; font-size:14px; outline:none; color:#ffffff; }
        .search-input::placeholder { color: rgba(255,255,255,0.75); }
        .search-input:focus { background: rgba(255,255,255,0.18); color:#997351; }
        .chat-list { flex:1; overflow-y:auto; }
        .chat-item { display:flex; padding:10px 12px; border-bottom:1px solid rgba(233,237,239,0.15); cursor:pointer; gap:10px; align-items:center; background:transparent; height:60px; }
        .chat-item:hover { background: rgba(255,255,255,0.06); }
        .chat-item.active { background: rgba(255,255,255,0.10); }
        .chat-info { flex:1; display:flex; flex-direction:column; min-width:0; }
        .chat-name-container { display:flex; align-items:center; gap:8px; }
        .chat-name { font-size:15px; font-weight:600; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .unread-badge { background:#ff6b6b; color:#ffffff; font-size:11px; font-weight:600; padding:2px 6px; border-radius:10px; min-width:18px; text-align:center; line-height:1.2; }
        .chat-preview { font-size:13px; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0.9; }
        .chat-time { font-size:12px; color:#ffffff; opacity:0.85; flex:0 0 78px; text-align:right; white-space:nowrap; }
        .chat-item:hover .chat-name,
        .chat-item:hover .chat-preview,
        .chat-item:hover .chat-time,
        .chat-item:focus-within .chat-name,
        .chat-item:focus-within .chat-preview,
        .chat-item:focus-within .chat-time,
        .chat-item.active .chat-name,
        .chat-item.active .chat-preview,
        .chat-item.active .chat-time { color:#dead6f; opacity:1; }
        .back-btn { background:rgba(255,255,255,0.15); color:#ffffff; border:none; border-radius:6px; padding:20px 12px; text-decoration:none; font-size:13px; display:inline-block; }
        .back-btn:hover, .back-btn:focus { background:rgba(255,255,255,0.25); color:#dead6f; }
        .sidebar-footer { padding:26px 16px; border-top:3px solid rgba(233,237,239,0.2); background:transparent; }

        .main-chat { flex:1; display:flex; flex-direction:column; background:#fafafa; }
        .chat-header { background:#f7f7f8; padding:10px 16px; display:flex; align-items:center; border-bottom:1px solid #e9edef; gap:12px; }
        #headerName { color:#000000; }
        #headerTime { color:#000000; }
        .chat-messages { flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
        .message { max-width:65%; padding:8px 12px; border-radius:7.5px; font-size:14px; line-height:1.5; position:relative; }
        .received { background:#fff; align-self:flex-start; border-top-left-radius:0; }
        .sent { background:#d9fdd3; align-self:flex-end; border-top-right-radius:0; }
        .message-time { font-size:11px; color:#4b5563; margin-left:8px; }
        .unread-indicator { color:#ff6b6b; font-size:12px; margin-left:4px; animation:pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.5; } }
        .chat-input { background:#f0f2f5; padding:8px 12px; display:flex; align-items:flex-end; border-top:1px solid #e9edef; gap:10px; }
        .input-box { flex:1; padding:9px 12px; background:#fff; border:none; border-radius:8px; font-size:14px; outline:none; resize:none; max-height:120px; min-height:42px; }
        .send-button { background:#00a884; color:#fff; border:none; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .typing { font-size:12px; color:#667781; padding:0 16px 8px; }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="chat-container">
        <div class="sidebar">
            <div class="header">
                <div style="font-weight:600; color:#ffffff;">Cuộc trò chuyện</div>
            </div>
            <div class="search-bar">
                <input id="searchInput" type="text" class="search-input" placeholder="Tìm theo tên hoặc SĐT">
            </div>
            <div id="chatList" class="chat-list"></div>
            <div class="sidebar-footer">
                <a th:href="@{/admin/thong-ke}" class="back-btn" style="width:100%; text-align:center;">
                    <svg xmlns="http://www.w3.org/2000/svg" style="display:inline;vertical-align:middle;" width="20" height="20" fill="none" viewBox="0 0 20 20">
                        <path d="M13.5 16L8 10.5L13.5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
        <div class="main-chat">
            <div class="chat-header">
                <div class="chat-info">
                    <div id="headerName" class="chat-name">Chưa chọn hội thoại</div>
                    <div id="headerTime" class="chat-preview"></div>
                </div>
            </div>
            <div id="typingIndicator" class="typing" style="display:none;">Khách đang nhập...</div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <textarea id="inputBox" class="input-box" placeholder="Nhập tin nhắn..."></textarea>
                <button id="sendBtn" class="send-button"><span class="icon">→</span></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let currentConversationId = null;
        let conversations = [];
        let typingTimeout = null;

        function fmtTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('vi-VN');
        }

        function sortConversationsByLastMessage() {
            conversations.sort((a, b) => {
                if (!a.lastMessageTime && !b.lastMessageTime) return 0;
                if (!a.lastMessageTime) return 1; // a lên cuối
                if (!b.lastMessageTime) return -1; // b lên cuối
                return new Date(b.lastMessageTime) - new Date(a.lastMessageTime); // Mới nhất lên đầu
            });
        }

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function () {
                loadConversations();
                
                // Subscribe để nhận thông báo tin nhắn mới cho tất cả conversation
                stompClient.subscribe('/topic/chat.notifications', function(message) {
                    try {
                        const data = JSON.parse(message.body);
                        console.log('Received chat notification:', data);
                        
                        if (data.type === 'NEW_MESSAGE' && data.senderType === 'CUSTOMER') {
                            // Cập nhật unreadCount cho conversation tương ứng
                            const conversationId = data.conversationId;
                            let idx = conversations.findIndex(x => x.id === conversationId);
                            
                            if (idx >= 0) {
                                // Conversation đã tồn tại, cập nhật thông tin
                                conversations[idx].unreadCount = (conversations[idx].unreadCount || 0) + 1;
                                conversations[idx].lastMessage = data.content;
                                conversations[idx].lastMessageTime = new Date().toISOString();
                                console.log('Updated existing conversation', conversationId, 'unreadCount to', conversations[idx].unreadCount);
                                
                                // Di chuyển conversation này lên đầu danh sách
                                const conversation = conversations.splice(idx, 1)[0];
                                conversations.unshift(conversation);
                                console.log('Moved conversation', conversationId, 'to top of list');
                            } else {
                                // Conversation mới, reload toàn bộ danh sách
                                console.log('New conversation detected, reloading conversation list');
                                loadConversations();
                                return;
                            }
                            
                            // Cập nhật UI ngay lập tức
                            renderChatList(conversations);
                        } else if (data.type === 'CONVERSATION_READ') {
                            // Khi conversation được đánh dấu đã đọc, reload để cập nhật từ server
                            console.log('Conversation marked as read, reloading conversation list');
                            loadConversations();
                        }
                    } catch (e) {
                        console.error('Error processing chat notification:', e);
                    }
                });
            });
        }

        async function loadConversations(){
            const res = await fetch('/api/chat/conversations');
            const list = await res.json();
            conversations = list;
            
            // Sắp xếp theo thời gian tin nhắn cuối cùng, mới nhất lên đầu
            sortConversationsByLastMessage();
            
            renderChatList(conversations);
        }

        function renderChatList(list){
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const filtered = list.filter(c => {
                return (c.customerName || '').toLowerCase().includes(q) || (c.customerContact || '').toLowerCase().includes(q);
            });
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            filtered.forEach(c => {
                const row = document.createElement('div');
                row.className = 'chat-item' + (c.id === currentConversationId ? ' active' : '');
                
                const info = document.createElement('div');
                info.className = 'chat-info';
                
                const nameContainer = document.createElement('div');
                nameContainer.className = 'chat-name-container';
                
                const name = document.createElement('div'); 
                name.className = 'chat-name'; 
                name.textContent = (c.customerName || 'Khách') + ' - ' + (c.customerContact || '');
                
                // Thêm indicator cho tin nhắn chưa đọc
                if (c.unreadCount > 0) {
                    const unreadBadge = document.createElement('span');
                    unreadBadge.className = 'unread-badge';
                    unreadBadge.textContent = c.unreadCount > 99 ? '99+' : c.unreadCount;
                    nameContainer.appendChild(name);
                    nameContainer.appendChild(unreadBadge);
                } else {
                    nameContainer.appendChild(name);
                }
                
                const preview = document.createElement('div'); 
                preview.className = 'chat-preview'; 
                preview.textContent = c.lastMessage || '';
                
                info.appendChild(nameContainer);
                info.appendChild(preview);
                
                const time = document.createElement('div'); 
                time.className = 'chat-time'; 
                time.textContent = fmtTime(c.lastMessageTime);
                
                row.appendChild(info);
                row.appendChild(time);
                row.addEventListener('click', () => openConversation(c));
                container.appendChild(row);
            });
        }

        async function openConversation(c){
            currentConversationId = c.id;
            document.getElementById('headerName').textContent = (c.customerName || 'Khách') + (c.customerContact ? ' - ' + c.customerContact : '');
            document.getElementById('headerTime').textContent = fmtTime(c.lastMessageTime);
            document.getElementById('chatMessages').innerHTML = '';
            
            // Reset unreadCount cho conversation này
            const idx = conversations.findIndex(x => x.id === c.id);
            if (idx >= 0) {
                conversations[idx].unreadCount = 0;
                console.log('Reset unreadCount for conversation', c.id);
            }
            
            // Cập nhật UI ngay lập tức
            renderChatList(conversations);

            stompClient.subscribe('/topic/conversation.' + c.id, onMessage, {id: 'sub-' + c.id});
            stompClient.subscribe('/topic/typing.' + c.id, onTyping, {id: 'sub-typing-' + c.id});

            const r = await fetch('/api/chat/messages/all/' + c.id);
            const msgs = await r.json();
            console.log('Loaded messages for conversation', c.id, ':', msgs);
            msgs.forEach(m => appendMessage(m));
            const pane = document.getElementById('chatMessages');
            pane.scrollTop = pane.scrollHeight;

            // Đánh dấu tất cả tin nhắn trong cuộc trò chuyện là đã đọc
            console.log('Marking conversation', c.id, 'as read');
            stompClient.send('/app/chat.mark-conversation-read/' + c.id, {}, JSON.stringify({
                timestamp: new Date().toISOString()
            }));
            
            // Reload conversation list để cập nhật UI từ server
            setTimeout(() => {
                loadConversations();
            }, 500);
        }

        function onMessage(frame){
            try {
                const m = JSON.parse(frame.body);
                appendMessage(m);
                const pane = document.getElementById('chatMessages');
                pane.scrollTop = pane.scrollHeight;
                
                // Cập nhật conversation hiện tại với tin nhắn mới
                if (currentConversationId) {
                    const idx = conversations.findIndex(x => x.id === currentConversationId);
                    if (idx >= 0) {
                        conversations[idx].lastMessage = m.content;
                        conversations[idx].lastMessageTime = m.createdAt;
                        
                        // Cập nhật UI nếu đang ở conversation khác
                        if (currentConversationId !== m.conversationId) {
                            renderChatList(conversations);
                        }
                        document.getElementById('headerTime').textContent = fmtTime(m.createdAt);
                    }
                }
                
                // Cập nhật conversation trong danh sách nếu có
                const conversationIdx = conversations.findIndex(x => x.id === m.conversationId);
                if (conversationIdx >= 0) {
                    conversations[conversationIdx].lastMessage = m.content;
                    conversations[conversationIdx].lastMessageTime = m.createdAt;
                    
                    // Di chuyển conversation này lên đầu danh sách nếu không phải conversation hiện tại
                    if (currentConversationId !== m.conversationId) {
                        const conversation = conversations.splice(conversationIdx, 1)[0];
                        conversations.unshift(conversation);
                        console.log('Moved conversation', m.conversationId, 'to top after receiving message');
                        renderChatList(conversations);
                    }
                }
            } catch(e) { console.error(e); }
        }

        function onTyping(frame){
            try {
                const data = JSON.parse(frame.body);
                const senderType = typeof data.senderType === 'string' ? data.senderType : data.senderType.name;
                
                if (senderType === 'CUSTOMER' && data.typing) {
                    document.getElementById('typingIndicator').style.display = '';
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        document.getElementById('typingIndicator').style.display = 'none';
                    }, 1500);
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            } catch(e) { console.error(e); }
        }

        function appendMessage(m){
            const msg = document.createElement('div');
            
            // Xử lý cả trường hợp senderType là string và enum object
            const senderType = typeof m.senderType === 'string' ? m.senderType : m.senderType.name;
            const isEmployee = senderType === 'EMPLOYEE';
            
            console.log('Appending message:', m.id, 'senderType:', senderType, 'isRead:', m.isRead);
            
            msg.className = 'message ' + (isEmployee ? 'sent' : 'received');
            
            // Thêm indicator cho tin nhắn chưa đọc
            const readStatus = !isEmployee && !m.isRead ? 
                '<span class="unread-indicator" title="Chưa đọc">●</span>' : '';
            
            msg.innerHTML = `${escapeHtml(m.content)} <span class="message-time">${fmtTime(m.createdAt)}</span> ${readStatus}`;
            document.getElementById('chatMessages').appendChild(msg);
        }

        function escapeHtml(s){
            return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        }

        const input = document.getElementById('inputBox');
        input.addEventListener('input', function(){
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            if (currentConversationId) {
                stompClient.send('/app/typing/' + currentConversationId, {}, JSON.stringify({ senderType: 'EMPLOYEE', typing: true }));
            }
        });
        input.addEventListener('keydown', function(e){
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        function sendMessage(){
            const content = input.value.trim();
            if (!content || !currentConversationId) return;
            
            // Cập nhật UI ngay lập tức cho tin nhắn của admin
            const idx = conversations.findIndex(x => x.id === currentConversationId);
            if (idx >= 0) {
                conversations[idx].lastMessage = content;
                conversations[idx].lastMessageTime = new Date().toISOString();
                
                // Di chuyển conversation này lên đầu danh sách
                const conversation = conversations.splice(idx, 1)[0];
                conversations.unshift(conversation);
                console.log('Moved conversation', currentConversationId, 'to top after admin message');
                
                renderChatList(conversations);
            }
            
            stompClient.send('/app/chat/' + currentConversationId, {}, JSON.stringify({
                senderType: 'EMPLOYEE', senderId: null, content: content
            }));
            input.value = '';
            input.style.height = '42px';
            stompClient.send('/app/typing/' + currentConversationId, {}, JSON.stringify({ senderType: 'EMPLOYEE', typing: false }));
        }

        document.getElementById('searchInput').addEventListener('input', () => renderChatList(conversations));

        connect();

        // Reset unread count khi vào trang chat
        if (window.parent && window.parent.resetUnreadCount) {
            window.parent.resetUnreadCount();
        }
        
        // Gửi thông báo đã đọc tất cả tin nhắn
        if (window.parent && window.parent.markAllAsRead) {
            window.parent.markAllAsRead();
        }
    </script>
</section>
</body>
</html>
