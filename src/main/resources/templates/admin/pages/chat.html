<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head>
    <title>Chat với khách hàng</title>
    <style>
        /* Modern Design System - Keeping Current Colors */
        :root {
            --primary-bg: #1f2937;
            --secondary-bg: #374151;
            --accent-color: #dead6f;
            --accent-hover: #fbbf24;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.7);
            --border-color: rgba(233, 237, 239, 0.15);
            --hover-bg: rgba(255, 255, 255, 0.06);
            --active-bg: rgba(255, 255, 255, 0.10);
            --unread-badge: #ff6b6b;
            --success-color: #00a884;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modern Container */
        .chat-container { 
            width: 100%; 
            height: 80vh; 
            background: #fff; 
            display: flex; 
            box-shadow: var(--shadow-lg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid #e5e7eb;
        }

        /* Modern Sidebar */
        .sidebar { 
            width: 32%; 
            background: var(--primary-bg);
            display: flex; 
            flex-direction: column;
            position: relative;
        }

        /* Modern Header */
        .header { 
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            padding: 24px 20px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
        }

        .header-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 18px;
            letter-spacing: -0.025em;
        }

        /* Modern Search Bar */
        .search-bar { 
            background: transparent; 
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .search-input { 
            width: 100%; 
            padding: 12px 16px 12px 44px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            font-size: 14px; 
            outline: none; 
            color: var(--text-primary);
            transition: var(--transition);
            position: relative;
        }

        .search-input::placeholder { 
            color: var(--text-muted);
        }

        .search-input:focus { 
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(222, 173, 111, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            z-index: 1;
        }

        /* Modern Chat List */
        .chat-list { 
            flex: 1; 
            overflow-y: auto;
            padding: 8px;
        }

        .chat-list::-webkit-scrollbar {
            width: 6px;
        }

        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .chat-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Modern Chat Item */
        .chat-item { 
            display: flex; 
            padding: 16px 16px 32px 16px;
            margin-bottom: 8px;
            border-radius: var(--radius-md);
            cursor: pointer; 
            gap: 16px; 
            align-items: flex-start; 
            background: transparent;
            transition: var(--transition);
            position: relative;
            border: 1px solid transparent;
        }

        .chat-item:hover { 
            background: var(--hover-bg);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .chat-item.active { 
            background: var(--active-bg);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 1px var(--accent-color), var(--shadow-md);
        }

        .chat-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-color);
            border-radius: 0 2px 2px 0;
        }

        /* Avatar Placeholder */
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-bg);
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        /* Chat Info */
        .chat-info { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-width: 0;
            gap: 4px;
        }

        .chat-name-container { 
            display: flex; 
            align-items: center; 
            gap: 8px;
            flex-wrap: wrap;
        }

        .chat-name { 
            font-size: 15px; 
            font-weight: 600; 
            color: var(--text-primary);
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .chat-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-unassigned {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .status-assigned {
            background: rgba(0, 168, 132, 0.2);
            color: var(--success-color);
        }

        .status-other {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        /* Unread Badge */
        .unread-badge { 
            background: var(--unread-badge);
            color: var(--text-primary);
            font-size: 11px; 
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
            line-height: 1.2;
            box-shadow: var(--shadow-sm);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Chat Preview */
        .chat-preview { 
            font-size: 13px; 
            color: var(--text-secondary);
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            line-height: 1.4;
            max-width: 200px;
        }

        /* Chat Time */
        .chat-time { 
            font-size: 11px; 
            color: var(--text-muted);
            position: absolute;
            bottom: 8px;
            right: 12px;
            white-space: nowrap;
            font-weight: 400;
            opacity: 0.8;
        }

        /* Hover Effects */
        .chat-item:hover .chat-name,
        .chat-item:hover .chat-preview,
        .chat-item:hover .chat-time,
        .chat-item:focus-within .chat-name,
        .chat-item:focus-within .chat-preview,
        .chat-item:focus-within .chat-time,
        .chat-item.active .chat-name,
        .chat-item.active .chat-preview,
        .chat-item.active .chat-time { 
            color: var(--accent-color);
        }

        .chat-item:hover .chat-avatar,
        .chat-item.active .chat-avatar {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        /* Back Button */
        .back-btn { 
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            transition: var(--transition);
            font-weight: 500;
            text-align: center;
            width: 100%;
        }

        .back-btn:hover, 
        .back-btn:focus { 
            background: rgba(255, 255, 255, 0.12);
            color: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .sidebar-footer { 
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: transparent;
        }

        /* Main Chat Area */
        .main-chat { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #fafafa;
        }

        .chat-header { 
            background: #f7f7f8; 
            padding: 20px 24px;
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid #e9edef;
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }

        #headerName { 
            color: #000000;
            font-weight: 600;
            font-size: 18px;
        }

        #headerTime { 
            color: #6b7280;
            font-size: 14px;
        }

        .chat-messages { 
            flex: 1; 
            padding: 24px;
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px;
        }

        .message { 
            max-width: 65%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 14px; 
            line-height: 1.5; 
            position: relative;
            box-shadow: var(--shadow-sm);
        }

        .received { 
            background: #fff; 
            align-self: flex-start; 
            border-top-left-radius: 4px;
            border: 1px solid #e5e7eb;
        }

        .sent { 
            background: var(--success-color); 
            color: white;
            align-self: flex-end; 
            border-top-right-radius: 4px;
        }

        .message-time { 
            font-size: 11px; 
            color: #6b7280; 
            margin-left: 8px;
            opacity: 0.8;
        }

        .unread-indicator { 
            color: var(--unread-badge); 
            font-size: 12px; 
            margin-left: 4px; 
            animation: pulse 2s infinite;
        }

        .typing { 
            font-size: 12px; 
            color: #667781; 
            padding: 0 24px 16px;
            font-style: italic;
        }

        .chat-input { 
            background: #f0f2f5; 
            padding: 20px 24px;
            display: flex; 
            align-items: flex-end; 
            border-top: 1px solid #e9edef; 
            gap: 16px;
            box-shadow: var(--shadow-sm);
        }

        .input-box { 
            flex: 1; 
            padding: 12px 16px; 
            background: #fff; 
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-md); 
            font-size: 14px; 
            outline: none; 
            resize: none; 
            max-height: 120px; 
            min-height: 48px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .input-box:focus {
            border-color: var(--success-color);
            box-shadow: 0 0 0 3px rgba(0, 168, 132, 0.1);
        }

        .send-button { 
            background: var(--success-color); 
            color: #fff; 
            border: none; 
            border-radius: 50%; 
            width: 48px; 
            height: 48px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .send-button:hover {
            background: #008f6f;
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
                height: 100vh;
            }
            
            .sidebar {
                width: 100%;
                height: 40%;
            }
            
            .main-chat {
                height: 60%;
            }
            
            .chat-item {
                padding: 12px;
            }
            
            .chat-avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        /* Focus States for Accessibility */
        .chat-item:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .search-input:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .send-button:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<section layout:fragment="content">
    <div class="chat-container">
        <div class="sidebar">
            <div class="header">
                <div class="header-title">Chăm sóc khách hàng</div>
            </div>
            <div class="search-bar">
                <svg class="search-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.098zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
                <input id="searchInput" type="text" class="search-input" placeholder="Tìm theo tên hoặc SĐT">
            </div>
            <div id="chatList" class="chat-list"></div>
            <div class="sidebar-footer">
                <button class="back-btn" onclick="goBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" style="display:inline;vertical-align:middle;" width="18" height="18" fill="none" viewBox="0 0 20 20">
                        <path d="M13.5 16L8 10.5L13.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Quay lại
                </button>
            </div>
        </div>
        <div class="main-chat">
            <div class="chat-header">
                <div class="chat-info">
                    <div id="headerName" class="chat-name">Chưa chọn hội thoại</div>
                    <div id="headerTime" class="chat-preview"></div>
                </div>
            </div>
            <div id="typingIndicator" class="typing" style="display:none;">✍️ Khách đang nhập...</div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <textarea id="inputBox" class="input-box" placeholder="Nhập tin nhắn..."></textarea>
                <button id="sendBtn" class="send-button">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:inline="javascript">
        // Lấy thông tin nhân viên hiện tại từ Thymeleaf
        const currentEmployeeId = /*[[${@get_nhan_vien.getCurrentNhanVien() != null ? @get_nhan_vien.getCurrentNhanVien().id : null}]]*/ null;
        
        let stompClient = null;
        let currentConversationId = null;
        let conversations = [];
        let typingTimeout = null;

        function fmtTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('vi-VN');
        }

        function fmtTimeCompact(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const diffTime = now - d;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) {
                // Hôm nay: chỉ hiển thị giờ
                return d.toLocaleTimeString('vi-VN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            } else if (diffDays === 1) {
                // Hôm qua
                return 'Hôm qua';
            } else if (diffDays < 7) {
                // Trong tuần: hiển thị thứ
                return d.toLocaleDateString('vi-VN', { weekday: 'short' });
            } else {
                // Cũ hơn: hiển thị ngày/tháng
                return d.toLocaleDateString('vi-VN', { 
                    day: '2-digit', 
                    month: '2-digit' 
                });
            }
        }

        function sortConversationsByLastMessage() {
            conversations.sort((a, b) => {
                if (!a.lastMessageTime && !b.lastMessageTime) return 0;
                if (!a.lastMessageTime) return 1; // a lên cuối
                if (!b.lastMessageTime) return -1; // b lên cuối
                return new Date(b.lastMessageTime) - new Date(a.lastMessageTime); // Mới nhất lên đầu
            });
        }

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function () {
                loadConversations();
                
                // Subscribe để nhận thông báo tin nhắn mới cho tất cả conversation
                stompClient.subscribe('/topic/chat.notifications', function(message) {
                    try {
                        const data = JSON.parse(message.body);
                        console.log('Received chat notification:', data);
                        
                        if (data.type === 'NEW_MESSAGE' && data.senderType === 'CUSTOMER') {
                            // Cập nhật unreadCount cho conversation tương ứng
                            const conversationId = data.conversationId;
                            let idx = conversations.findIndex(x => x.id === conversationId);
                            
                            if (idx >= 0) {
                                // Conversation đã tồn tại, cập nhật thông tin
                                conversations[idx].unreadCount = (conversations[idx].unreadCount || 0) + 1;
                                conversations[idx].lastMessage = data.content;
                                conversations[idx].lastMessageTime = new Date().toISOString();
                                console.log('Updated existing conversation', conversationId, 'unreadCount to', conversations[idx].unreadCount);
                                
                                // Di chuyển conversation này lên đầu danh sách
                                const conversation = conversations.splice(idx, 1)[0];
                                conversations.unshift(conversation);
                                console.log('Moved conversation', conversationId, 'to top of list');
                            } else {
                                // Conversation mới, reload toàn bộ danh sách
                                console.log('New conversation detected, reloading conversation list');
                                loadConversations();
                                return;
                            }
                            
                            // Cập nhật UI ngay lập tức
                            renderChatList(conversations);
                        } else if (data.type === 'CONVERSATION_READ') {
                            // Khi conversation được đánh dấu đã đọc, reload để cập nhật từ server
                            console.log('Conversation marked as read, reloading conversation list');
                            loadConversations();
                        }
                    } catch (e) {
                        console.error('Error processing chat notification:', e);
                    }
                });
            });
        }

        async function loadConversations(){
            // Sử dụng endpoint mới để chỉ lấy conversation phù hợp với nhân viên
            const res = await fetch('/api/chat/conversations/employee/' + currentEmployeeId);
            const list = await res.json();
            conversations = list;
            console.log('Loaded conversations for employee:', currentEmployeeId, conversations);
            
            // Sắp xếp theo thời gian tin nhắn cuối cùng, mới nhất lên đầu
            sortConversationsByLastMessage();
            
            renderChatList(conversations);
        }

        function renderChatList(list){
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            const filtered = list.filter(c => {
                return (c.customerName || '').toLowerCase().includes(q) || (c.customerContact || '').toLowerCase().includes(q);
            });
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            filtered.forEach(c => {
                const row = document.createElement('div');
                row.className = 'chat-item' + (c.id === currentConversationId ? ' active' : '');
                
                // Create info container
                const info = document.createElement('div');
                info.className = 'chat-info';
                
                const nameContainer = document.createElement('div');
                nameContainer.className = 'chat-name-container';
                
                const name = document.createElement('div'); 
                name.className = 'chat-name'; 
                const customerName = c.customerName || 'Khách';
                const customerContact = c.customerContact || '';
                
                // Hiển thị tên và số điện thoại
                if (customerContact) {
                    name.textContent = `${customerName} - ${customerContact}`;
                } else {
                    name.textContent = customerName;
                }
                
                // Create status badge - chỉ hiển thị cho khách hàng chưa được gán
                let status = null;
                if (c.assignedEmployeeId === null) {
                    status = document.createElement('span');
                    status.className = 'chat-status status-unassigned';
                    status.textContent = 'Mới';
                }
                
                // Add unread badge
                if (c.unreadCount > 0) {
                    const unreadBadge = document.createElement('span');
                    unreadBadge.className = 'unread-badge';
                    unreadBadge.textContent = c.unreadCount > 99 ? '99+' : c.unreadCount;
                    nameContainer.appendChild(name);
                    if (status) nameContainer.appendChild(status);
                    nameContainer.appendChild(unreadBadge);
                } else {
                    nameContainer.appendChild(name);
                    if (status) nameContainer.appendChild(status);
                }
                
                const preview = document.createElement('div'); 
                preview.className = 'chat-preview'; 
                preview.textContent = c.lastMessage || 'Chưa có tin nhắn';
                
                info.appendChild(nameContainer);
                info.appendChild(preview);
                
                // Tạo thời gian gọn hơn
                const time = document.createElement('div'); 
                time.className = 'chat-time'; 
                
                // Format thời gian gọn hơn
                if (c.lastMessageTime) {
                    const messageDate = new Date(c.lastMessageTime);
                    const now = new Date();
                    const diffTime = now - messageDate;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays === 0) {
                        // Hôm nay: chỉ hiển thị giờ
                        time.textContent = messageDate.toLocaleTimeString('vi-VN', { 
                            hour: '2-digit', 
                            minute: '2-digit' 
                        });
                    } else if (diffDays === 1) {
                        // Hôm qua
                        time.textContent = 'Hôm qua';
                    } else if (diffDays < 7) {
                        // Trong tuần: hiển thị thứ
                        time.textContent = messageDate.toLocaleDateString('vi-VN', { weekday: 'short' });
                    } else {
                        // Cũ hơn: hiển thị ngày/tháng
                        time.textContent = messageDate.toLocaleDateString('vi-VN', { 
                            day: '2-digit', 
                            month: '2-digit' 
                        });
                    }
                } else {
                    time.textContent = '';
                }
                
                row.appendChild(info);
                row.appendChild(time);
                row.addEventListener('click', () => openConversation(c));
                container.appendChild(row);
            });
        }

        async function openConversation(c){
            // Kiểm tra xem nhân viên có thể chat với conversation này không
            if (c.assignedEmployeeId !== null && c.assignedEmployeeId !== currentEmployeeId) {
                alert('Bạn không thể chat với conversation này vì đã được gán cho nhân viên khác!');
                return;
            }
            
            currentConversationId = c.id;
            document.getElementById('headerName').textContent = (c.customerName || 'Khách') + (c.customerContact ? ' - ' + c.customerContact : '');
            document.getElementById('headerTime').textContent = fmtTime(c.lastMessageTime);
            document.getElementById('chatMessages').innerHTML = '';
            
            // Reset unreadCount cho conversation này
            const idx = conversations.findIndex(x => x.id === c.id);
            if (idx >= 0) {
                conversations[idx].unreadCount = 0;
                console.log('Reset unreadCount for conversation', c.id);
            }
            
            // Cập nhật UI ngay lập tức
            renderChatList(conversations);

            stompClient.subscribe('/topic/conversation.' + c.id, onMessage, {id: 'sub-' + c.id});
            stompClient.subscribe('/topic/typing.' + c.id, onTyping, {id: 'sub-typing-' + c.id});

            const r = await fetch('/api/chat/messages/all/' + c.id);
            const msgs = await r.json();
            console.log('Loaded messages for conversation', c.id, ':', msgs);
            msgs.forEach(m => appendMessage(m));
            const pane = document.getElementById('chatMessages');
            pane.scrollTop = pane.scrollHeight;

            // Đánh dấu tất cả tin nhắn trong cuộc trò chuyện là đã đọc
            console.log('Marking conversation', c.id, 'as read');
            stompClient.send('/app/chat.mark-conversation-read/' + c.id, {}, JSON.stringify({
                timestamp: new Date().toISOString()
            }));
            
            // Reload conversation list để cập nhật UI từ server
            setTimeout(() => {
                loadConversations();
            }, 500);
        }

        function onMessage(frame){
            try {
                const m = JSON.parse(frame.body);
                appendMessage(m);
                const pane = document.getElementById('chatMessages');
                pane.scrollTop = pane.scrollHeight;
                
                // Cập nhật conversation hiện tại với tin nhắn mới
                if (currentConversationId) {
                    const idx = conversations.findIndex(x => x.id === currentConversationId);
                    if (idx >= 0) {
                        conversations[idx].lastMessage = m.content;
                        conversations[idx].lastMessageTime = m.createdAt;
                        
                        // Cập nhật UI nếu đang ở conversation khác
                        if (currentConversationId !== m.conversationId) {
                            renderChatList(conversations);
                        }
                        document.getElementById('headerTime').textContent = fmtTime(m.createdAt);
                    }
                }
                
                // Cập nhật conversation trong danh sách nếu có
                const conversationIdx = conversations.findIndex(x => x.id === m.conversationId);
                if (conversationIdx >= 0) {
                    conversations[conversationIdx].lastMessage = m.content;
                    conversations[conversationIdx].lastMessageTime = m.createdAt;
                    
                    // Di chuyển conversation này lên đầu danh sách nếu không phải conversation hiện tại
                    if (currentConversationId !== m.conversationId) {
                        const conversation = conversations.splice(conversationIdx, 1)[0];
                        conversations.unshift(conversation);
                        console.log('Moved conversation', m.conversationId, 'to top after receiving message');
                        renderChatList(conversations);
                    }
                }
            } catch(e) { console.error(e); }
        }

        function onTyping(frame){
            try {
                const data = JSON.parse(frame.body);
                const senderType = typeof data.senderType === 'string' ? data.senderType : data.senderType.name;
                
                if (senderType === 'CUSTOMER' && data.typing) {
                    document.getElementById('typingIndicator').style.display = '';
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        document.getElementById('typingIndicator').style.display = 'none';
                    }, 1500);
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            } catch(e) { console.error(e); }
        }

        function appendMessage(m){
            const msg = document.createElement('div');
            
            // Xử lý cả trường hợp senderType là string và enum object
            const senderType = typeof m.senderType === 'string' ? m.senderType : m.senderType.name;
            const isEmployee = senderType === 'EMPLOYEE';
            
            console.log('Appending message:', m.id, 'senderType:', senderType, 'isRead:', m.isRead);
            
            msg.className = 'message ' + (isEmployee ? 'sent' : 'received');
            
            // Thêm indicator cho tin nhắn chưa đọc
            const readStatus = !isEmployee && !m.isRead ? 
                '<span class="unread-indicator" title="Chưa đọc">●</span>' : '';
            
            msg.innerHTML = `${escapeHtml(m.content)} <span class="message-time">${fmtTime(m.createdAt)}</span> ${readStatus}`;
            document.getElementById('chatMessages').appendChild(msg);
        }

        function escapeHtml(s){
            return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        }

        const input = document.getElementById('inputBox');
        input.addEventListener('input', function(){
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            if (currentConversationId) {
                stompClient.send('/app/typing/' + currentConversationId, {}, JSON.stringify({ senderType: 'EMPLOYEE', typing: true }));
            }
        });
        input.addEventListener('keydown', function(e){
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        function sendMessage(){
            const content = input.value.trim();
            if (!content || !currentConversationId) return;
            
            // Cập nhật UI ngay lập tức cho tin nhắn của admin
            const idx = conversations.findIndex(x => x.id === currentConversationId);
            if (idx >= 0) {
                conversations[idx].lastMessage = content;
                conversations[idx].lastMessageTime = new Date().toISOString();
                
                // Di chuyển conversation này lên đầu danh sách
                const conversation = conversations.splice(idx, 1)[0];
                conversations.unshift(conversation);
                console.log('Moved conversation', currentConversationId, 'to top after admin message');
                
                renderChatList(conversations);
            }
            
            stompClient.send('/app/chat/' + currentConversationId, {}, JSON.stringify({
                senderType: 'EMPLOYEE', senderId: currentEmployeeId, content: content
            }));
            input.value = '';
            input.style.height = '42px';
            stompClient.send('/app/typing/' + currentConversationId, {}, JSON.stringify({ senderType: 'EMPLOYEE', typing: false }));
            
            // Reload conversation list để cập nhật trạng thái assignment
            setTimeout(() => {
                loadConversations();
            }, 1000);
        }

        document.getElementById('searchInput').addEventListener('input', () => renderChatList(conversations));

        connect();

        // Function để quay lại trang trước
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // Nếu không có lịch sử, chuyển về trang admin chính
                window.location.href = '/admin';
            }
        }

        // Reset unread count khi vào trang chat
        if (window.parent && window.parent.resetUnreadCount) {
            window.parent.resetUnreadCount();
        }
        
        // Gửi thông báo đã đọc tất cả tin nhắn
        if (window.parent && window.parent.markAllAsRead) {
            window.parent.markAllAsRead();
        }
    </script>
</section>
