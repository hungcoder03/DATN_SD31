<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Sửa sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Sửa thông tin sản phẩm</h2>

    <form th:action="@{/admin/san-pham/sua}" th:object="${sanpham}" method="post" enctype="multipart/form-data" class="row g-3">

        <!-- Ẩn ID -->
        <input type="hidden" th:field="*{id}" />

        <!-- Tên sản phẩm -->
        <div class="col-md-6">
            <label for="ten" class="form-label">Tên sản phẩm</label>
            <input type="text" id="ten" th:field="*{ten}" class="form-control" placeholder="Nhập tên sản phẩm" required />
        </div>

<!--        &lt;!&ndash; Giá &ndash;&gt;-->
<!--        <div class="col-md-6">-->
<!--            <label for="gia" class="form-label">Giá</label>-->
<!--            <input type="number" id="gia" th:field="*{gia}" class="form-control" placeholder="VD: 100000" required />-->
<!--        </div>-->

        <!-- Mô tả -->
        <div class="col-12">
            <label for="moTa" class="form-label">Mô tả</label>
            <textarea id="moTa" th:field="*{mota}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Danh sách ảnh hiện tại</label>
            <div class="row">
                <div class="col-md-3" th:each="anh, iterStat : *{hinhAnhs}">
                    <div class="card mb-3">
                        <img th:src="@{${anh.url}}" class="card-img-top" alt="Ảnh sản phẩm">
                        <div class="card-body">
                            <label>Thay ảnh:</label>
                            <input type="file" class="form-control" name="hinhAnhs[__${iterStat.index}__]">
                            <input type="hidden" th:name="anhIds" th:value="${anh.id}" />
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:name="xoaAnhIds" th:value="${anh.id}" id="xoa__${anh.id}">
                                <input class="form-check-input" type="checkbox"
                                       th:name="xoaAnhIds"
                                       th:value="${anh.id}"
                                       th:id="|xoa__${anh.id}|">Xóa ảnh
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label>Thêm ảnh mới:</label>
            <input type="file" class="form-control" name="anhMoi" multiple>
        </div>

        <!-- Upload ảnh mới -->
        <div class="col-md-6">
            <label for="fileAnh" class="form-label">Thay ảnh mới (nếu cần)</label>
            <input type="file" name="fileAnh" id="fileAnh" class="form-control" />
        </div>

        <!-- Nút submit -->
        <div class="col-12">
            <button type="submit" class="btn btn-success">Lưu thay đổi</button>
            <a th:href="@{/admin/san-pham/danh-sach}" class="btn btn-secondary ms-2">Quay lại</a>
        </div>
    </form>
    <a th:href="@{/admin/san-pham/hien_thi}" class="btn btn-secondary ms-2">Quay lại</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
