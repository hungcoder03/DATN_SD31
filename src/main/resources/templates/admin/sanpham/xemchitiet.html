<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .mau-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .mau-button {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #aaa;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            text-decoration: none;
            min-width: 100px;
            text-align: center;
        }

        .mau-button:hover {
            opacity: 0.8;
        }

        /* Chữ màu đen nếu nền sáng */
        .mau-button[style*="yellow"],
        .mau-button[style*="white"] {
            color: black;
        }

        .btn-them-mau {
            display: inline-block;
            padding: 10px 20px;
            border: 2px dashed #999;
            border-radius: 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }

        .btn-them-mau:hover {
            background-color: #e9ecef;
        }

        .chi-tiet-block {
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .btn-quay-lai {
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #ccc;
            font-weight: bold;
            background-color: #f8f9fa;
            transition: 0.3s;
        }

        .btn-quay-lai:hover {
            background-color: #e2e6ea;
            color: #000;
            text-decoration: none;
        }
        .btn-quay-lai {
            position: fixed;
            bottom: 30px;
            right: 30px;
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.2);
            border: 1px solid #ccc;
            font-weight: bold;
            background-color: #f8f9fa;
            z-index: 999;
            transition: 0.3s ease;
        }

        .btn-quay-lai:hover {
            background-color: #e2e6ea;
            color: #000;
            text-decoration: none;
        }

    </style>
</head>
<body>

<div class="container mt-5">
    <h3 class="mb-4">Các biến thể đã có</h3>
    <form th:action="@{/admin/san-pham/cap-nhat-dot-giam-gia}" method="post">
        <input type="hidden" name="sanPhamId" th:value="${sanPham.id}" />

        <!-- Chọn đợt giảm giá -->
        <div class="row g-2 align-items-center mb-3">
            <div class="col-md-4">
                <select name="dotGiamGiaId" class="form-select" required>
                    <option value="">-- Chọn đợt giảm giá --</option>
                    <option th:each="dgg : ${dsDotGiamGia}"
                            th:value="${dgg.id}"
                            th:text="${dgg.ten}">
                    </option>
                </select>

            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-success">Áp dụng đợt giảm giá</button>
            </div>
        </div>

        <!-- Danh sách chi tiết -->
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Chọn</th>
                <th>Màu</th>
                <th>Size</th>
                <th>Giá gốc</th>
                <th>Giá nhập</th>
                <th>Giá bán</th>
                <th>Đang áp dụng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ct : ${dsChiTietSanPham}">
                <td><input type="checkbox" name="chiTietIds" th:value="${ct.id}" /></td>
                <td th:text="${ct.mauSac.ten}"></td>
                <td th:text="${ct.size.ten}"></td>
                <td th:text="${ct.giaGoc}"></td>
                <td th:text="${ct.giaNhap}"></td>
                <td th:text="${ct.giaBan}"></td>
                <td th:text="${ct.dotGiamGia != null ? ct.dotGiamGia.ten : 'Không'}"></td>
            </tr>
            </tbody>
        </table>
    </form>


    <h4 class="mt-5">Chọn màu để thêm biến thể còn thiếu:</h4>
    <div class="mau-wrapper">
        <div th:each="mau : ${cacMau}">
            <a th:href="@{/admin/san-pham/chitietsanpham/them(id=${sanPham.id}, mauId=${mau.id})}"
               class="mau-button"
               th:style="'background-color:' + ${mau.ten}"
               th:text="${mau.ten}">
            </a>
        </div>

        <!-- Nút thêm màu -->
        <a th:href="@{/admin/san-pham/xem/{id}(id=${sanPham.id}, themMau=true)}" class="btn-them-mau" >+</a>
    </div>
    <div th:if="${themMau == true}" class="mt-3">
        <form method="post" th:action="@{/admin/san-pham/them-mau}">
            <input type="hidden" name="sanPhamId" th:value="${sanPham.id}" />
            <!-- Nhập mã và tên màu mới nếu không chọn màu cũ -->
            <div class="row g-2 align-items-center">
                <div class="col-md-3">
                    <input type="text" name="maMau" class="form-control" placeholder="Mã màu (VD: MAU01)" />
                </div>
                <div class="col-md-3">
                    <input type="text" name="tenMau" class="form-control" placeholder="Tên màu (VD: red, blue)" />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">Lưu</button>
                    <a th:href="@{/admin/san-pham/xem/{id}(id=${sanPham.id})}" class="btn btn-secondary btn-sm">Hủy</a>
                </div>
            </div>
        </form>
    </div>
    <!-- Nút quay lại -->
    <div class="d-flex justify-content-end mt-4">
        <a th:href="@{/admin/san-pham/hien_thi}" class="btn btn-light btn-quay-lai">
            ← Quay lại
        </a>
    </div>

    <form method="post" th:action="@{/admin/san-pham/chitietsanpham/them(sanPhamId=${sanPham.id})}" th:object="${form}" class="mt-4" th:if="${form.chiTietList.size() > 0}">
        <h5 class="mt-4 mb-3" th:text="'Thêm biến thể cho màu: ' + ${mauDangChon.ten}"></h5>

        <div th:each="ct, iter : *{chiTietList}" class="chi-tiet-block">
            <button type="button" class="btn btn-sm btn-danger float-end" onclick="xoaBienThe(this)">X</button>
            <p>
                <strong>Size:</strong> <span th:text="${ct.size.ten}"></span>
                <strong> | Màu sắc:</strong> <span th:text="${ct.mauSac.ten}"></span>
            </p>

            <!-- Hidden fields -->
            <input type="hidden" th:field="*{chiTietList[__${iter.index}__].sanPham.id}" />
            <input type="hidden" th:field="*{chiTietList[__${iter.index}__].mauSac.id}" />
            <input type="hidden" th:field="*{chiTietList[__${iter.index}__].size.id}" />

            <!-- Chỉ giữ lại 3 trường cần nhập -->
            <div class="mb-2">
                <label>Giá bán:</label>
                <input type="number" th:field="*{chiTietList[__${iter.index}__].giaGoc}" class="form-control" required min="0" />
            </div>
            <div class="mb-2">
                <label>Giá nhập:</label>
                <input type="number" th:field="*{chiTietList[__${iter.index}__].giaNhap}" class="form-control" required min="0" />
            </div>
            <div class="mb-2">
                <label>Số lượng:</label>
                <input type="number" th:field="*{chiTietList[__${iter.index}__].soLuong}" class="form-control" required min="0" />
            </div>
        </div>
        <div class="d-flex justify-content-start gap-2 mt-3">

            <button type="submit" class="btn btn-success">Lưu tất cả</button>
            <a th:href="@{/admin/san-pham/xem/{id}(id=${sanPham.id})}" class="btn btn-secondary">Hủy</a>
        </div>

    </form>
</div>

<script>
    function xoaBienThe(button) {
        const block = button.closest('.chi-tiet-block');
        if (block) {
            block.remove();
        }
    }
    function toggleAll(masterCheckbox) {
        document.querySelectorAll('input[name="chiTietIds"]').forEach(cb => cb.checked = masterCheckbox.checked);
    }
</script>

</body>
</html>
