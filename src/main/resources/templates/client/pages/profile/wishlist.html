<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{client/layout}">

<head>
    <title th:text="#{wishlist.title}">Sản phẩm yêu thích - Waggy Pet Shop</title>
    <meta name="description" th:content="#{wishlist.description}">
    
    <!-- CSRF Token for form submission -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    
    <!-- Custom CSS for wishlist -->
    <style>
        /* CSS Variables for Warm Yellow Theme (đồng bộ với cart) */
        :root {
            --border-primary: #e8e0d0;
            --border-secondary: #d2b48c;
            --border-brand: #f4a261;
            --theme-bg: #faf9f6;
            --theme-surface: #f5f5f0;
            --theme-surface-hover: #f0e6d2;
            --theme-text: #2c3e50;
            --theme-text-secondary: #7f8c8d;
            --brand-surface: #f4a261;
            --brand-surface-hover: #e67e22;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
        }

        .wishlist-item {
            transition: all 0.3s ease;
            border: 1px solid var(--border-primary);
            background-color: var(--theme-surface);
        }
        
        .wishlist-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
            border-color: var(--border-brand);
            background-color: var(--theme-surface-hover);
        }
        
        .item-checkbox {
            transform: scale(1.2);
            cursor: pointer;
            z-index: 10;
        }
        
        .item-checkbox:checked {
            background-color: var(--brand-surface);
            border-color: var(--brand-surface);
        }
        
        .remove-single-btn {
            opacity: 0.7;
            transition: all 0.2s ease;
            background-color: var(--danger-color);
            border-color: var(--danger-color);
            color: white;
        }
        
        .remove-single-btn:hover {
            opacity: 1;
            transform: scale(1.1);
            background-color: #c82333;
            border-color: #bd2130;
        }
        
        .card-img-top img {
            transition: transform 0.3s ease;
        }
        
        .wishlist-item:hover .card-img-top img {
            transform: scale(1.05);
        }
        
        .btn {
            transition: all 0.2s ease;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .btn-primary {
            background-color: var(--brand-surface);
            border-color: var(--brand-surface);
        }
        
        .btn-primary:hover {
            background-color: var(--brand-surface-hover);
            border-color: var(--brand-surface-hover);
        }
        
        .price-section .text-danger {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--brand-surface) !important;
        }
        
        .badge {
            font-size: 0.75rem;
        }
        
        .badge.bg-danger {
            background-color: var(--danger-color) !important;
        }
        
        .pagination .page-link {
            border-radius: 0.375rem;
            margin: 0 2px;
            border-color: var(--border-primary);
            color: var(--theme-text);
        }
        
        .pagination .page-item.active .page-link {
            background-color: var(--brand-surface);
            border-color: var(--brand-surface);
            color: white;
        }
        
        .empty-wishlist .empty-icon {
            color: var(--border-secondary);
        }
        
        .empty-wishlist .btn {
            padding: 0.75rem 2rem;
            font-weight: 500;
            background-color: var(--brand-surface);
            border-color: var(--brand-surface);
        }
        
        .empty-wishlist .btn:hover {
            background-color: var(--brand-surface-hover);
            border-color: var(--brand-surface-hover);
        }
        
        /* Selection mode styling */
        .wishlist-item.select-mode {
            border: 2px solid var(--brand-surface);
            background-color: var(--theme-surface-hover);
        }
        
        .wishlist-item.select-mode .item-checkbox {
            opacity: 1;
        }
        
        /* Loading animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fa-spin {
            animation: spin 1s linear infinite;
        }

        /* Rating stars */
        .rating-stars {
            color: var(--warning-color);
        }
        
        .rating-stars .text-muted {
            color: var(--border-secondary) !important;
        }
        
        /* Stock status */
        .stock-status {
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .stock-status.in-stock {
            color: var(--success-color);
        }
        
        .stock-status.low-stock {
            color: var(--warning-color);
        }
        
        .stock-status.out-of-stock {
            color: var(--danger-color);
        }
        
        /* Discount badge */
        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--danger-color);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 5;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">


        <!-- Wishlist Content -->
        <section class="wishlist-section py-5">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <!-- Header -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h1 class="h2 fw-bold text-dark mb-0" th:text="#{wishlist.title}">Sản phẩm yêu thích</h1>
                            <div class="d-flex align-items-center">
                                <span class="text-muted me-3" th:text="#{wishlist.total_items} + ': ' + ${totalItems}">Tổng số: 0</span>
                                <button id="selectAllBtn" class="btn btn-outline-primary btn-sm me-2" style="display: none;">
                                    <i class="fas fa-check-square me-1"></i>
                                    <span th:text="#{wishlist.select_all}">Chọn tất cả</span>
                                </button>
                                <button id="removeSelectedBtn" class="btn btn-outline-danger btn-sm" style="display: none;">
                                    <i class="fas fa-trash me-1"></i>
                                    <span th:text="#{wishlist.remove_selected}">Xóa đã chọn</span>
                                </button>
                            </div>
                        </div>

                        <!-- Wishlist Items -->
                        <div th:if="${wishlistItems != null and !wishlistItems.isEmpty()}" class="wishlist-items">
                            <div class="row g-4">
                                <div th:each="item : ${wishlistItems}" class="col-lg-3 col-md-4 col-sm-6">
                                    <div class="card h-100 shadow-sm border-0 wishlist-item" th:data-product-id="${item.sanPham.id}">
                                        <!-- Checkbox -->
                                        <div class="position-absolute top-0 start-0 p-2">
                                            <input type="checkbox" class="form-check-input item-checkbox" 
                                                   th:value="${item.sanPham.id}">
                                        </div>
                                        
                                        <!-- Remove Button -->
                                        <div class="position-absolute top-0 end-0 p-2">
                                            <button class="btn btn-sm btn-outline-danger remove-single-btn" 
                                                    th:data-product-id="${item.sanPham.id}"
                                                    th:title="#{wishlist.remove_item}">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                        
                                        <!-- Product Image -->
                                        <div class="card-img-top position-relative" style="height: 200px; overflow: hidden;">
                                            <!-- Discount Badge - Dynamic -->
                                            <div th:if="${phanTramGiamMap != null and phanTramGiamMap.containsKey(item.sanPham.id)}" 
                                                 class="discount-badge">
                                                <span th:text="${phanTramGiamMap.get(item.sanPham.id)}">-20%</span>
                                            </div>
                                            
                                            <!-- Ảnh chính từ hinhAnhs với loaiAnh == 0 -->
                                            <img th:each="img : ${item.sanPham.hinhAnhs}"
                                                 th:if="${img.loaiAnh == 0}"
                                                 th:src="@{${img.url}}"
                                                 th:alt="${item.sanPham.ten}"
                                                 class="w-100 h-100 object-fit-cover"
                                                 onerror="this.src='/client-static/images/item1.jpg'">
                                            <!-- Fallback image nếu không có ảnh -->
                                            <img th:if="${item.sanPham.hinhAnhs == null or item.sanPham.hinhAnhs.isEmpty()}"
                                                 src="/client-static/images/item1.jpg"
                                                 th:alt="${item.sanPham.ten}"
                                                 class="w-100 h-100 object-fit-cover">
                                        </div>
                                        
                                        <!-- Product Info -->
                                        <div class="card-body d-flex flex-column">
                                            <!-- Brand with icon - Dynamic -->
                                            <div class="d-flex align-items-center gap-2 mb-2" th:if="${item.sanPham.thuongHieu != null}">
                                                <i class="fas fa-tag text-muted" style="font-size: 0.75rem;"></i>
                                                <small class="text-muted fw-medium" th:text="${item.sanPham.thuongHieu.ten}">Thương hiệu</small>
                                            </div>
                                            
                                            <h5 class="card-title h6 fw-bold text-dark mb-2" th:text="${item.sanPham.ten}">Tên sản phẩm</h5>
                                            
                                            <!-- Price Section -->
                                            <div class="price-section mb-3">
                                                <div class="d-flex align-items-baseline gap-2 mb-1">
                                                    <!-- Giá bán - Dynamic -->
                                                    <div th:with="giaBan=${giaBanMinMap != null ? giaBanMinMap.get(item.sanPham.id) : null}, giaGoc=${giaGocMinMap != null ? giaGocMinMap.get(item.sanPham.id) : null}, giaGocMax=${giaGocMaxMap != null ? giaGocMaxMap.get(item.sanPham.id) : null}">
                                                        <span th:if="${giaBan != null and giaGoc != null and giaBan.compareTo(giaGoc) < 0}">
                                                            <span class="line-through text-muted me-2" 
                                                                  th:text="${#numbers.formatDecimal(giaGoc, 0, 'COMMA', 0, 'POINT') + '₫'}">100.000₫</span>
                                                            <span class="h5 fw-bold text-danger mb-0" 
                                                                  th:text="${#numbers.formatDecimal(giaBan, 0, 'COMMA', 0, 'POINT') + '₫'}">80.000₫</span>
                                                        </span>
                                                        <span th:if="${giaBan != null and giaGoc != null and giaBan.compareTo(giaGoc) >= 0}"
                                                              th:text="${#numbers.formatDecimal(giaGoc, 0, 'COMMA', 0, 'POINT') + '₫' + (giaGocMax != null and giaGocMax.compareTo(giaGoc) > 0 ? ' – ' + #numbers.formatDecimal(giaGocMax, 0, 'COMMA', 0, 'POINT') + '₫' : '')}"
                                                              class="h5 fw-bold text-danger mb-0">100.000₫ – 150.000₫</span>
                                                        <span th:if="${giaBan == null and giaGoc == null}" 
                                                              class="h5 fw-bold text-muted mb-0"
                                                              th:text="#{product.contact_for_price}">Liên hệ</span>
                                                    </div>
                                                </div>
                                                
                                                <!-- Thông tin đợt giảm giá - Dynamic -->
                                                <div th:if="${phanTramGiamMap != null and phanTramGiamMap.containsKey(item.sanPham.id)}" class="mt-1">
                                                    <span class="badge bg-danger text-white text-xs fw-semibold rounded-pill px-2 py-1">
                                                        <span th:text="${phanTramGiamMap.get(item.sanPham.id)}">-20%</span>
                                                    </span>
                                                </div>
                                            </div>
                                            
                                            <!-- Rating Section -->
                                            <div class="d-flex align-items-center justify-content-between mb-3">
                                                <div class="d-flex align-items-center gap-2">
                                                    <div class="d-flex rating-stars">
                                                        <!-- Dynamic Rating based on actual data -->
                                                        <span th:with="rating=${(item.sanPham.danhGias != null) ? #lists.size(item.sanPham.danhGias) : 0}, full=${T(java.lang.Math).floor(rating)}, half=${(rating - T(java.lang.Math).floor(rating)) >= 0.5}" th:remove="tag">
                                                            <i th:each="i : ${#numbers.sequence(1,5)}" 
                                                               class="fas fa-star transition-colors duration-200" 
                                                               th:classappend="${i <= full} ? 'text-warning' : (${half} and ${i == full + 1} ? 'text-warning opacity-75' : 'text-muted')"
                                                               style="font-size: 0.875rem;">
                                                            </i>
                                                        </span>
                                                    </div>
                                                    <small class="text-muted fw-medium">
                                                        <span th:text="${#lists.size(item.sanPham.danhGias)}">0</span>
                                                        <span th:text="#{product.review_count}">đánh giá</span>
                                                    </small>
                                                </div>
                                            </div>
                                            
                                            <!-- Actions -->
                                            <div class="mt-auto">
                                                <div class="d-grid gap-2">
                                                    <a th:href="@{/san-pham/chi-tiet/{id}(id=${item.sanPham.id})}" 
                                                       class="btn btn-primary btn-sm">
                                                        <i class="fas fa-eye me-1"></i>
                                                        <span th:text="#{wishlist.view_details}">Xem chi tiết</span>
                                                    </a>
                                                </div>
                                            </div>
                                            
                                            <!-- Added Date -->
                                            <small class="text-muted mt-2">
                                                <i class="fas fa-clock me-1"></i>
                                                <span th:text="#{wishlist.added_on}">Thêm ngày:</span>
                                                <span th:text="${#temporals.format(item.thoiGianThem, 'dd/MM/yyyy')}">01/01/2024</span>
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Pagination -->
                            <nav th:if="${totalPages > 1}" class="mt-5">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                                        <a class="page-link" th:href="@{/khach-hang/yeu-thich(page=${currentPage - 1})}" th:text="#{pagination.previous}">Trước</a>
                                    </li>
                                    <li th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                                        class="page-item"
                                        th:classappend="${pageNum == currentPage} ? 'active'">
                                        <a class="page-link" th:href="@{/khach-hang/yeu-thich(page=${pageNum})}"
                                           th:text="${pageNum + 1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                                        <a class="page-link" th:href="@{/khach-hang/yeu-thich(page=${currentPage + 1})}" th:text="#{pagination.next}">Sau</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>

                        <!-- Empty State -->
                        <div th:if="${wishlistItems == null or wishlistItems.isEmpty()}" class="empty-wishlist text-center py-5">
                            <div class="empty-icon mb-4">
                                <i class="fas fa-heart fa-5x text-muted"></i>
                            </div>
                            <h3 class="h4 text-muted mb-3" th:text="#{wishlist.empty_title}">Danh sách yêu thích trống</h3>
                            <p class="text-muted mb-4" th:text="#{wishlist.empty_message}">Bạn chưa có sản phẩm nào trong danh sách yêu thích.</p>
                            <a th:href="@{/san-pham/danh-sach}" class="btn btn-primary">
                                <i class="fas fa-shopping-bag me-2"></i>
                                <span th:text="#{wishlist.start_shopping}">Bắt đầu mua sắm</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const selectAllBtn = document.getElementById('selectAllBtn');
                const removeSelectedBtn = document.getElementById('removeSelectedBtn');
                const itemCheckboxes = document.querySelectorAll('.item-checkbox');
                const removeSingleBtns = document.querySelectorAll('.remove-single-btn');
                const wishlistItems = document.querySelectorAll('.wishlist-item');

                // Show/hide selection controls
                function toggleSelectionControls() {
                    const hasItems = itemCheckboxes.length > 0;
                    selectAllBtn.style.display = hasItems ? 'inline-block' : 'none';
                    
                    const checkedItems = document.querySelectorAll('.item-checkbox:checked');
                    removeSelectedBtn.style.display = checkedItems.length > 0 ? 'inline-block' : 'none';
                    
                    // Update selection mode styling
                    wishlistItems.forEach(item => {
                        const checkbox = item.querySelector('.item-checkbox');
                        if (checkbox.checked) {
                            item.classList.add('select-mode');
                        } else {
                            item.classList.remove('select-mode');
                        }
                    });
                }

                // Select all functionality
                selectAllBtn.addEventListener('click', function() {
                    const allChecked = Array.from(itemCheckboxes).every(cb => cb.checked);
                    itemCheckboxes.forEach(cb => cb.checked = !allChecked);
                    selectAllBtn.innerHTML = allChecked ? 
                        '<i class="fas fa-check-square me-1"></i>Chọn tất cả' : 
                        '<i class="fas fa-square me-1"></i>Bỏ chọn tất cả';
                    toggleSelectionControls();
                });

                // Individual checkbox change
                itemCheckboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', toggleSelectionControls);
                });

                // Remove selected items using form submission
                removeSelectedBtn.addEventListener('click', function() {
                    const selectedIds = Array.from(document.querySelectorAll('.item-checkbox:checked'))
                        .map(cb => parseInt(cb.value));
                    
                    if (selectedIds.length === 0) return;
                    
                    if (confirm('Bạn có chắc chắn muốn xóa ' + selectedIds.length + ' sản phẩm khỏi danh sách yêu thích?')) {
                        // Create and submit form for multiple removal
                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = '/khach-hang/yeu-thich/xoa-nhieu';
                        
                        // Add CSRF token if exists
                        const csrfToken = document.querySelector('meta[name="_csrf"]');
                        if (csrfToken) {
                            const csrfInput = document.createElement('input');
                            csrfInput.type = 'hidden';
                            csrfInput.name = '_csrf';
                            csrfInput.value = csrfToken.getAttribute('content');
                            form.appendChild(csrfInput);
                        }
                        
                        // Add selected product IDs
                        selectedIds.forEach(id => {
                            const input = document.createElement('input');
                            input.type = 'hidden';
                            input.name = 'productIds';
                            input.value = id;
                            form.appendChild(input);
                        });
                        
                        // Show loading state
                        removeSelectedBtn.disabled = true;
                        removeSelectedBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Đang xóa...';
                        
                        // Submit form
                        document.body.appendChild(form);
                        form.submit();
                    }
                });

                // Remove single item using form submission
                removeSingleBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const productId = parseInt(this.getAttribute('data-product-id'));
                        if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi danh sách yêu thích?')) {
                            // Create and submit form for single removal
                            const form = document.createElement('form');
                            form.method = 'POST';
                            form.action = '/khach-hang/yeu-thich/toggle';
                            
                            // Add CSRF token if exists
                            const csrfToken = document.querySelector('meta[name="_csrf"]');
                            if (csrfToken) {
                                const csrfInput = document.createElement('input');
                                csrfInput.type = 'hidden';
                                csrfInput.name = '_csrf';
                                csrfInput.value = csrfToken.getAttribute('content');
                                form.appendChild(csrfInput);
                            }
                            
                            // Add product ID
                            const input = document.createElement('input');
                            input.type = 'hidden';
                            input.name = 'productId';
                            input.value = productId;
                            form.appendChild(input);
                            
                            // Show loading state
                            btn.disabled = true;
                            const originalText = btn.innerHTML;
                            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                            
                            // Submit form
                            document.body.appendChild(form);
                            form.submit();
                        }
                    });
                });

                // Initialize
                toggleSelectionControls();
            });
        </script>
    </th:block>
</body>

</html>
