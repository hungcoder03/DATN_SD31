<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">

<head>
    <title>Quên mật khẩu - D&C Fashions</title>
    
    <!-- Custom CSS for validation -->
    <style>
        .form-control.is-valid {
            border-color: #198754;
            padding-right: calc(1.5em + 0.75rem);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%23198754' d='m2.3 6.73.94-.94 3.47-3.47L7.1 1.86 6.16.92 4.72 2.36 2.3 4.78l.94.94L5.66 3.3z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
            padding-right: calc(1.5em + 0.75rem);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath d='m5.8 4.6 1.4 1.4M7.2 4.6l-1.4 1.4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        
        .valid-feedback {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 0.875em;
            color: #198754;
        }
        
        .invalid-feedback {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 0.875em;
            color: #dc3545;
        }
        
        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4">🔐 Quên mật khẩu</h2>
                            <p class="text-center text-muted mb-4">
                                Nhập email của bạn để nhận mã xác nhận đặt lại mật khẩu
                            </p>

                            <form th:action="@{/quen-mat-khau}" method="post" id="forgotPasswordForm" novalidate>
                                <div class="mb-4">
                                    <label class="form-label">
                                        <i class="fas fa-envelope me-2"></i>
                                        Email: <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" name="email" id="email" class="form-control" required 
                                           placeholder="Nhập email của bạn" 
                                           autocomplete="email" />
                                    <div class="invalid-feedback" id="emailError"></div>
                                    <div class="valid-feedback" id="emailSuccess"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                                    <i class="fas fa-paper-plane me-2"></i>
                                    <span id="submitText">Gửi mã xác nhận</span>
                                    <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                                </button>
                                
                                <div class="text-center">
                                    <span class="text-muted">Nhớ mật khẩu? </span>
                                    <a href="/khach-hang/dang-nhap" class="text-primary text-decoration-none">
                                        Đăng nhập ngay
                                    </a>
                                </div>
                            </form>

                            <!-- Thông báo lỗi -->
                            <div th:if="${error}" class="alert alert-danger mt-3">
                                <p class="mb-0">❌ <span th:text="${error}"></span></p>
                            </div>

                            <!-- Thông báo thành công -->
                            <div th:if="${success}" class="alert alert-success mt-3">
                                <p class="mb-0">✅ <span th:text="${success}"></span></p>
                            </div>

                            <!-- Thông báo từ URL params -->
                            <div th:if="${param.error}" class="alert alert-danger mt-3">
                                <p class="mb-0">❌ <span th:text="${param.error}"></span></p>
                            </div>
                            <div th:if="${param.success}" class="alert alert-success mt-3">
                                <p class="mb-0">✅ <span th:text="${param.success}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts fragment for Thymeleaf layout -->
    <th:block layout:fragment="scripts">
        <script>
            // Real-time validation for forgot password form
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            let emailValid = false;
            let isSubmitting = false;

            // Email validation function
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            // Update submit button state
            function updateSubmitButton() {
                if (emailValid && !isSubmitting) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-secondary');
                    submitBtn.classList.add('btn-primary');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('btn-primary');
                    submitBtn.classList.add('btn-secondary');
                }
            }

            // Real-time email validation
            emailInput.addEventListener('input', function() {
                const email = this.value.trim();
                const emailError = document.getElementById('emailError');
                const emailSuccess = document.getElementById('emailSuccess');
                
                // Reset validation state
                this.classList.remove('is-valid', 'is-invalid');
                emailError.textContent = '';
                emailSuccess.textContent = '';
                
                if (email === '') {
                    emailValid = false;
                } else if (!validateEmail(email)) {
                    this.classList.add('is-invalid');
                    emailError.textContent = 'Vui lòng nhập email hợp lệ';
                    emailValid = false;
                } else {
                    this.classList.add('is-valid');
                    emailSuccess.textContent = '✓ Email hợp lệ';
                    emailValid = true;
                }
                
                updateSubmitButton();
            });

            // Form submission with loading state
            document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
                if (!emailValid || isSubmitting) {
                    e.preventDefault();
                    return;
                }
                
                // Show loading state
                isSubmitting = true;
                submitText.textContent = 'Đang gửi...';
                loadingSpinner.classList.remove('d-none');
                submitBtn.disabled = true;
                
                // Re-enable after 5 seconds as fallback
                setTimeout(() => {
                    isSubmitting = false;
                    submitText.textContent = 'Gửi mã xác nhận';
                    loadingSpinner.classList.add('d-none');
                    updateSubmitButton();
                }, 5000);
            });

            // Initial button state
            updateSubmitButton();
        </script>
    </th:block>
</body>

</html>
