<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{client/layout}">

<head>
    <title>Đặt lại mật khẩu - D&C Fashions</title>
    
    <!-- Custom CSS for validation -->
    <style>
        .form-control.is-valid {
            border-color: #198754;
            padding-right: calc(1.5em + 0.75rem);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%23198754' d='m2.3 6.73.94-.94 3.47-3.47L7.1 1.86 6.16.92 4.72 2.36 2.3 4.78l.94.94L5.66 3.3z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
            padding-right: calc(1.5em + 0.75rem);
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath d='m5.8 4.6 1.4 1.4M7.2 4.6l-1.4 1.4'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right calc(0.375em + 0.1875rem) center;
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }
        
        .valid-feedback {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 0.875em;
            color: #198754;
        }
        
        .invalid-feedback {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 0.875em;
            color: #dc3545;
        }
        
        .form-text {
            margin-top: 0.25rem;
            font-size: 0.875em;
        }
        
        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4">🔐 Đặt lại mật khẩu</h2>
                            <p class="text-center text-muted mb-4">
                                Nhập mã xác nhận và mật khẩu mới của bạn
                            </p>

                            <form th:action="@{/quen-mat-khau/dat-lai}" method="post" id="resetPasswordForm" novalidate>
                                <input type="hidden" name="email" th:value="${email}" />
                                
                                <div class="mb-3">
                                    <label class="form-label">
                                        <i class="fas fa-envelope me-2"></i>
                                        Email:
                                    </label>
                                    <input type="email" class="form-control" th:value="${email}" readonly 
                                           style="background-color: #f8f9fa;" />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        <i class="fas fa-key me-2"></i>
                                        Mã xác nhận: <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" name="code" id="code" class="form-control" required 
                                           placeholder="Nhập mã 6 số từ email" maxlength="6" />
                                    <div class="invalid-feedback" id="codeError"></div>
                                    <div class="valid-feedback" id="codeSuccess"></div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">
                                                <i class="fas fa-lock me-2"></i>
                                                Mật khẩu mới: <span class="text-danger">*</span>
                                            </label>
                                            <input type="password" name="newPassword" id="newPassword" class="form-control" required 
                                                   placeholder="Nhập mật khẩu mới" 
                                                   autocomplete="new-password" />
                                            <div class="invalid-feedback" id="newPasswordError"></div>
                                            <div class="valid-feedback" id="newPasswordSuccess"></div>
                                            <div class="form-text" id="passwordStrength"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">
                                                <i class="fas fa-lock me-2"></i>
                                                Xác nhận mật khẩu: <span class="text-danger">*</span>
                                            </label>
                                            <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required 
                                                   placeholder="Nhập lại mật khẩu mới" 
                                                   autocomplete="new-password" />
                                            <div class="invalid-feedback" id="confirmPasswordError"></div>
                                            <div class="valid-feedback" id="confirmPasswordSuccess"></div>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                                    <i class="fas fa-check me-2"></i>
                                    <span id="submitText">Đặt lại mật khẩu</span>
                                    <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                                </button>
                                
                                <div class="text-center">
                                    <span class="text-muted">Chưa nhận được mã? </span>
                                    <a href="/quen-mat-khau" class="text-primary text-decoration-none">
                                        Gửi lại mã
                                    </a>
                                </div>
                            </form>

                            <!-- Thông báo lỗi -->
                            <div th:if="${error}" class="alert alert-danger mt-3">
                                <p class="mb-0">❌ <span th:text="${error}"></span></p>
                            </div>

                            <!-- Thông báo thành công -->
                            <div th:if="${success}" class="alert alert-success mt-3">
                                <p class="mb-0">✅ <span th:text="${success}"></span></p>
                            </div>

                            <!-- Thông báo từ URL params -->
                            <div th:if="${param.error}" class="alert alert-danger mt-3">
                                <p class="mb-0">❌ <span th:text="${param.error}"></span></p>
                            </div>
                            <div th:if="${param.success}" class="alert alert-success mt-3">
                                <p class="mb-0">✅ <span th:text="${param.success}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts fragment for Thymeleaf layout -->
    <th:block layout:fragment="scripts">
        <script>
            // Real-time validation for reset password form
            const codeInput = document.getElementById('code');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            let codeValid = false;
            let newPasswordValid = false;
            let confirmPasswordValid = false;
            let isSubmitting = false;

            // Validation functions
            function validateCode(code) {
                return /^\d{6}$/.test(code);
            }

            function validatePassword(password) {
                return password.length >= 6;
            }

            function validateConfirmPassword(password, confirmPassword) {
                return password === confirmPassword && password !== '';
            }

            function getPasswordStrength(password) {
                if (password.length < 6) return { text: 'Quá ngắn', class: 'text-danger' };
                if (password.length < 8) return { text: 'Yếu', class: 'text-warning' };
                if (password.length < 10) return { text: 'Trung bình', class: 'text-info' };
                if (password.length < 12) return { text: 'Mạnh', class: 'text-success' };
                return { text: 'Rất mạnh', class: 'text-success' };
            }

            // Update submit button state
            function updateSubmitButton() {
                if (codeValid && newPasswordValid && confirmPasswordValid && !isSubmitting) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('btn-secondary');
                    submitBtn.classList.add('btn-primary');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('btn-primary');
                    submitBtn.classList.add('btn-secondary');
                }
            }

            // Real-time code validation
            codeInput.addEventListener('input', function() {
                const code = this.value;
                const codeError = document.getElementById('codeError');
                const codeSuccess = document.getElementById('codeSuccess');
                
                this.classList.remove('is-valid', 'is-invalid');
                codeError.textContent = '';
                codeSuccess.textContent = '';
                
                if (code === '') {
                    codeValid = false;
                } else if (!validateCode(code)) {
                    this.classList.add('is-invalid');
                    codeError.textContent = 'Mã xác nhận phải là 6 số';
                    codeValid = false;
                } else {
                    this.classList.add('is-valid');
                    codeSuccess.textContent = '✓ Mã xác nhận hợp lệ';
                    codeValid = true;
                }
                
                updateSubmitButton();
            });

            // Real-time new password validation
            newPasswordInput.addEventListener('input', function() {
                const password = this.value;
                const passwordError = document.getElementById('newPasswordError');
                const passwordSuccess = document.getElementById('newPasswordSuccess');
                const passwordStrength = document.getElementById('passwordStrength');
                
                this.classList.remove('is-valid', 'is-invalid');
                passwordError.textContent = '';
                passwordSuccess.textContent = '';
                
                if (password === '') {
                    newPasswordValid = false;
                    passwordStrength.textContent = '';
                } else if (!validatePassword(password)) {
                    this.classList.add('is-invalid');
                    passwordError.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                    newPasswordValid = false;
                    passwordStrength.textContent = '';
                } else {
                    this.classList.add('is-valid');
                    passwordSuccess.textContent = '✓ Mật khẩu hợp lệ';
                    newPasswordValid = true;
                    
                    const strength = getPasswordStrength(password);
                    passwordStrength.textContent = `Độ mạnh: ${strength.text}`;
                    passwordStrength.className = `form-text ${strength.class}`;
                }
                
                // Re-validate confirm password
                validateConfirmPasswordField();
                updateSubmitButton();
            });

            // Real-time confirm password validation
            confirmPasswordInput.addEventListener('input', function() {
                validateConfirmPasswordField();
                updateSubmitButton();
            });

            function validateConfirmPasswordField() {
                const password = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const confirmError = document.getElementById('confirmPasswordError');
                const confirmSuccess = document.getElementById('confirmPasswordSuccess');
                
                confirmPasswordInput.classList.remove('is-valid', 'is-invalid');
                confirmError.textContent = '';
                confirmSuccess.textContent = '';
                
                if (confirmPassword === '') {
                    confirmPasswordValid = false;
                } else if (!validateConfirmPassword(password, confirmPassword)) {
                    confirmPasswordInput.classList.add('is-invalid');
                    confirmError.textContent = 'Mật khẩu xác nhận không khớp';
                    confirmPasswordValid = false;
                } else {
                    confirmPasswordInput.classList.add('is-valid');
                    confirmSuccess.textContent = '✓ Mật khẩu xác nhận khớp';
                    confirmPasswordValid = true;
                }
            }

            // Auto-format code input (only numbers)
            codeInput.addEventListener('input', function(e) {
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            // Form submission with loading state
            document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
                if (!codeValid || !newPasswordValid || !confirmPasswordValid || isSubmitting) {
                    e.preventDefault();
                    return;
                }
                
                // Show loading state
                isSubmitting = true;
                submitText.textContent = 'Đang xử lý...';
                loadingSpinner.classList.remove('d-none');
                submitBtn.disabled = true;
                
                // Re-enable after 5 seconds as fallback
                setTimeout(() => {
                    isSubmitting = false;
                    submitText.textContent = 'Đặt lại mật khẩu';
                    loadingSpinner.classList.add('d-none');
                    updateSubmitButton();
                }, 5000);
            });

            // Initial button state
            updateSubmitButton();
        </script>
    </th:block>
</body>

</html>
