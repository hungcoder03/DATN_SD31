# Blog Posts
blog.post1.title=Cách chăm sóc chó con đúng cách
blog.post1.excerpt=Hướng dẫn chi tiết cách chăm sóc chó con từ 2-6 tháng tuổi, bao gồm dinh dưỡng, vệ sinh và huấn luyện cơ bản.
blog.post1.content=Chó con từ 2-6 tháng tuổi là giai đoạn quan trọng nhất trong quá trình phát triển. Ở giai đoạn này, chó con cần được chăm sóc đặc biệt về dinh dưỡng, vệ sinh và huấn luyện cơ bản. Dinh dưỡng cần đảm bảo đầy đủ protein, vitamin và khoáng chất để hỗ trợ sự phát triển của xương và cơ bắp. Vệ sinh cần được thực hiện thường xuyên, bao gồm tắm rửa, chải lông và vệ sinh răng miệng. Huấn luyện cơ bản nên bắt đầu từ việc dạy chó con đi vệ sinh đúng chỗ, nghe lệnh cơ bản và làm quen với môi trường xung quanh.

blog.post2.title=Dinh dưỡng tối ưu cho mèo trưởng thành
blog.post2.excerpt=Chế độ dinh dưỡng khoa học giúp mèo trưởng thành khỏe mạnh, lông bóng mượt và tinh thần sảng khoái.
blog.post2.content=Mèo trưởng thành cần một chế độ dinh dưỡng cân bằng và đầy đủ để duy trì sức khỏe tối ưu. Protein động vật chất lượng cao là thành phần quan trọng nhất, chiếm khoảng 30-40% khẩu phần ăn. Chất béo cung cấp năng lượng và hỗ trợ hấp thu vitamin tan trong dầu. Taurine là axit amin thiết yếu mà mèo không thể tự tổng hợp, cần được bổ sung từ thức ăn. Nước uống sạch và đầy đủ cũng rất quan trọng để tránh các vấn đề về đường tiết niệu.

blog.post3.title=Đồ chơi thông minh cho thú cưng
blog.post3.excerpt=Khám phá những loại đồ chơi thông minh giúp kích thích trí não và giảm stress cho thú cưng của bạn.
blog.post3.content=Đồ chơi thông minh không chỉ giúp thú cưng giải trí mà còn kích thích phát triển trí não và giảm stress. Puzzle toys giúp mèo và chó phải suy nghĩ để lấy được thức ăn ẩn bên trong. Interactive toys kích thích bản năng săn mồi tự nhiên. Chew toys giúp chó mài mòn răng và giảm lo lắng. Laser pointers kích thích mèo vận động và săn mồi. Việc luân phiên các loại đồ chơi khác nhau giúp thú cưng không bị nhàm chán và luôn có hứng thú.

blog.post4.title=Chăm sóc sức khỏe định kỳ cho thú cưng
blog.post4.excerpt=Lịch trình tiêm chủng, khám sức khỏe và các biện pháp phòng bệnh quan trọng cho thú cưng.
blog.post4.content=Chăm sóc sức khỏe định kỳ là yếu tố quan trọng để đảm bảo thú cưng sống lâu và khỏe mạnh. Tiêm chủng cần được thực hiện đúng lịch trình từ khi còn nhỏ và nhắc lại hàng năm. Khám sức khỏe định kỳ 6-12 tháng một lần giúp phát hiện sớm các vấn đề sức khỏe. Tẩy giun định kỳ 3-6 tháng một lần để phòng ngừa ký sinh trùng. Vệ sinh răng miệng thường xuyên giúp phòng ngừa các bệnh về răng và nướu. Chế độ ăn uống cân bằng và vận động đều đặn cũng góp phần quan trọng.

blog.post5.title=Chuẩn bị cho thú cưng khi đi du lịch
blog.post5.excerpt=Hướng dẫn chi tiết cách chuẩn bị và chăm sóc thú cưng khi đi du lịch xa nhà.
blog.post5.content=Du lịch cùng thú cưng cần được chuẩn bị kỹ lưỡng để đảm bảo an toàn và thoải mái. Trước khi đi, cần kiểm tra sức khỏe và cập nhật thông tin tiêm chủng. Chuẩn bị đầy đủ thức ăn, nước uống, đồ dùng cá nhân và thuốc cần thiết. Sử dụng carrier hoặc dây dắt phù hợp để đảm bảo an toàn trong quá trình di chuyển. Tìm hiểu trước các quy định về thú cưng tại điểm đến. Trong quá trình di chuyển, cần dừng nghỉ thường xuyên để thú cưng có thể vận động và đi vệ sinh.

# About Us
about.title=Về chúng tôi
about.subtitle=Chăm sóc thú cưng với tình yêu và trách nhiệm
about.company.name=Waggy Pet Shop
about.company.slogan=Chăm sóc thú cưng với tình yêu và trách nhiệm
about.company.description=Waggy Pet Shop được thành lập với sứ mệnh mang đến những sản phẩm và dịch vụ chăm sóc thú cưng chất lượng cao nhất. Chúng tôi tin rằng mỗi thú cưng đều xứng đáng được yêu thương và chăm sóc tốt nhất.
about.company.history=Được thành lập vào năm 2020, Waggy Pet Shop đã trải qua 4 năm phát triển với sự tin tưởng của hơn 10,000 khách hàng. Từ một cửa hàng nhỏ, chúng tôi đã phát triển thành một hệ thống chăm sóc thú cưng toàn diện.
about.company.mission=Sứ mệnh của chúng tôi là cung cấp những sản phẩm chất lượng cao, dịch vụ chăm sóc chuyên nghiệp và kiến thức hữu ích để giúp chủ nuôi chăm sóc thú cưng một cách tốt nhất.
about.company.vision=Tầm nhìn của chúng tôi là trở thành đối tác tin cậy nhất trong việc chăm sóc thú cưng tại Việt Nam, góp phần nâng cao chất lượng cuộc sống của thú cưng và chủ nuôi.
about.company.values=Chúng tôi luôn đặt chất lượng, uy tín và sự hài lòng của khách hàng lên hàng đầu. Mỗi sản phẩm đều được chọn lọc kỹ lưỡng, mỗi dịch vụ đều được thực hiện với tâm huyết và trách nhiệm cao nhất.
about.company.founded_location=Thành phố Hồ Chí Minh, Việt Nam

